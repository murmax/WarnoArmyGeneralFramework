  description:
    ru: 'Дата: 7 сентября 1989 года

      Продолжительность: 20 ходов

      Район: Кача — Бельбек — Севастополь, Крым


      Пока основные силы противников связаны боями в Центральной Европе, американское командование открывает
      новый фронт на Чёрном море. Передовые батальоны 2-й дивизии морской пехоты высаживаются у Качи.
      Их задача — расширить плацдарм, прорваться через Бельбек и овладеть Севастополем.


      Черноморский флот застигнут в разгар мобилизации. 810-я отдельная бригада морской пехоты принимает
      первый удар, а гарнизоны и местные силы обороны пытаются выиграть время. Из Симферополя постепенно
      подходят недоукомплектованные полковые группы 157-й мотострелковой дивизии.


      НАТО должно взять Севастополь; СССР — отбить Качу и сорвать высадку. Захват Симферополя блокирует
      советские дивизионные подкрепления. Если к исходу 20-го хода решающая цель не достигнута, операция
      считается провалом американского вторжения.'
    en: 'Date: 7 September 1989

      Duration: 20 turns

      Area: Kacha — Belbek — Sevastopol, Crimea


      With both alliances committed in Central Europe, US command opens a new front on the Black Sea.
      The 2nd Marine Division lands at Kacha to secure its beachhead, break through Belbek and seize Sevastopol.


      The Black Sea Fleet is caught during mobilization. The 810th Naval Infantry Brigade faces the first
      assault while local garrisons buy time. Incomplete regimental groups of the 157th Motor Rifle Division
      assemble at Simferopol and enter the battle in successive waves.


      NATO must capture Sevastopol; the USSR must retake Kacha and break the landing. Taking Simferopol
      blocks Soviet divisional reinforcements. If neither decisive objective is achieved by turn 20, the
      operation ends in failure for the American invasion.'
