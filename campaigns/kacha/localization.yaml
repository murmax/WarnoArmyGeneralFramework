    'Kacha: Defense of Sevastopol': 'Kacza: obrona Sewastopola'
    'NATO: take Sevastopol. USSR: retake Kacha.': 'NATO: zdobyć Sewastopol. ZSRR: odbić Kaczę.'
    '#US #SOV #medium{BLACK SEA — SEPTEMBER 1989} Kacha: Defense of Sevastopol': '#US #SOV #medium{MORZE
      CZARNE — WRZESIEŃ 1989} Kacza: obrona Sewastopola'
    Amphibious landing against the Black Sea Fleet base: Desant przeciw bazie Floty Czarnomorskiej
    DEFENSE OF SEVASTOPOL: OBRONA SEWASTOPOLA
    ? Commander, you now lead the defense of Sevastopol. The Kacha landing has begun, but the main American
      force is still coming ashore.
    : Dowódco, obejmuje pan obronę Sewastopola. Desant w Kaczy już się rozpoczął, lecz główne siły amerykańskie
      dopiero schodzą na ląd.
    THE 810TH BRIGADE: 810. BRYGADA
    ? Naval infantry protects Belbek, Bakhchysarai and Sevastopol. Facility guards are weaker; use them
      to preserve regular battalions for the decisive fight.
    : Piechota morska osłania Belbek, Bachczysaraj i Sewastopol. Oddziały ochrony są słabsze; wykorzystaj
      je, by zachować regularne bataliony do rozstrzygającego starcia.
    AIRFIELDS HIT: LOTNISKA POD OSTRZAŁEM
    ? The first strike crippled Kacha airfield and destroyed most aircraft on the ground. Surviving helicopters
      joined the 881st Assault Battalion while the airfield guard still fights.
    : Pierwsze uderzenie sparaliżowało lotnisko Kacza i zniszczyło większość maszyn na ziemi. Ocalałe
      śmigłowce dołączyły do 881. batalionu szturmowego, a ochrona lotniska nadal walczy.
    157TH MOTOR RIFLE DIVISION: 157. DYWIZJA ZMOTORYZOWANA
    CRIMEAN BEACHHEAD: KRYMSKI PRZYCZÓŁEK
    ? Colonel, the first landing wave has secured a foothold. Soviet outposts still resist, but the sea
      route for follow-on echelons is open.
    : Pułkowniku, pierwsza fala desantu zdobyła przyczółek. Radzieckie posterunki nadal stawiają opór,
      ale droga morska dla kolejnych rzutów jest otwarta.
    INVASION FORCE: SIŁY INWAZYJNE
    ? Infantry has amphibious vehicles, engineers and air defense. Heavy tanks follow later; open the
      exits from the beach before the Soviet line closes.
    : Piechota ma pojazdy amfibijne, saperów i obronę przeciwlotniczą. Ciężkie czołgi nadejdą później;
      otwórz wyjścia z plaży, zanim radziecka linia się zamknie.
    THE FLEET SUPPORTS THE ADVANCE: FLOTA WSPIERA NATARCIE
    ? Carrier aircraft control western Crimea for now. Helicopters move reconnaissance and support the
      Marines; Soviet aircraft may return from other airfields.
    : Lotnictwo pokładowe na razie kontroluje zachodni Krym. Śmigłowce przewożą zwiadowców i wspierają
      marines; radzieckie samoloty mogą wrócić z innych lotnisk.
    TIME IS AGAINST US: CZAS DZIAŁA PRZECIW NAM
    VICTORY: ZWYCIĘSTWO
    Sevastopol has fallen. The landing force achieved its main objective; command approves the next phase.: Sewastopol
      padł. Desant osiągnął główny cel; dowództwo zatwierdza kolejną fazę.
    OPERATION STALLED: OPERACJA UTKNĘŁA
    ? Sevastopol was not taken in time. No further American reinforcements will come; approaching Soviet
      reserves force the landing to prepare its defense.
    : Sewastopola nie zdobyto na czas. Dalsze posiłki amerykańskie nie nadejdą; zbliżające się radzieckie
      rezerwy zmuszają desant do obrony.
    OPERATION FAILED: OPERACJA ZAKOŃCZONA FIASKIEM
    ? Sevastopol has not fallen. The landing failed to achieve its main objective, and command is terminating
      the operation. Holding the beachhead cannot change the outcome.
    : Sewastopol nie padł. Desant nie osiągnął głównego celu, a dowództwo kończy operację. Utrzymanie
      przyczółka nie zmieni już wyniku.
    SEVASTOPOL TAKEN: SEWASTOPOL ZDOBYTY
    Marines occupy the Black Sea Fleet base. The main objective is complete.: Marines zajmują bazę Floty
      Czarnomorskiej. Główny cel osiągnięto.
    SEVASTOPOL ISOLATED: SEWASTOPOL ODIZOLOWANY
    We hold the Kacha–Balaklava corridor. The city's land routes are cut.: Trzymamy korytarz Kacza–Bałakława.
      Lądowe drogi do miasta zostały odcięte.
    SEVASTOPOL HOLDS: SEWASTOPOL STAWIA OPÓR
    Sevastopol has not been taken or completely isolated. An assault would require extending the operation.: Sewastopola
      nie zdobyto ani całkowicie nie odizolowano. Szturm wymagałby przedłużenia operacji.
    BEACHHEAD LOST: PRZYCZÓŁEK UTRACONY
    Soviet forces retook Kacha. The ground force can no longer be supplied at scale.: Wojska radzieckie
      odbiły Kaczę. Zaopatrzenie sił lądowych na dużą skalę nie jest już możliwe.
    BEACHHEAD HELD: PRZYCZÓŁEK UTRZYMANY
    Kacha remains ours. Sea supply continues, but the offensive has lost momentum.: Kacza pozostaje w
      naszych rękach. Zaopatrzenie morskie trwa, ale ofensywa straciła impet.
    CRIMEAN BREAKTHROUGH: PRZEŁAMANIE NA KRYMIE
    Kacha and Simferopol are ours. Soviet reserve movement is disrupted.: Kacza i Symferopol są nasze.
      Ruch radzieckich rezerw został zakłócony.
    ? Sevastopol has held. Soviet forces have denied the American invasion its main objective. The enemy
      no longer has time for a decisive assault.
    : Sewastopol się utrzymał. Wojska radzieckie udaremniły główny cel amerykańskiej inwazji. Przeciwnik
      nie ma już czasu na rozstrzygający szturm.
    DEFENSE CONTINUES: OBRONA TRWA
    ? Sevastopol holds, but the landing remains in Crimea. Clearing the beachhead will require diverting
      additional reserves from other fronts.
    : Sewastopol się broni, lecz desant pozostaje na Krymie. Likwidacja przyczółka wymaga przerzucenia
      kolejnych rezerw z innych frontów.
    DEFENSE BROKEN: OBRONA PRZEŁAMANA
    Sevastopol is lost. Surviving units withdraw toward Simferopol and prepare a counterattack.: Sewastopol
      stracony. Ocalałe oddziały wycofują się ku Symferopolowi i przygotowują kontratak.
    SEVASTOPOL LOST: SEWASTOPOL UTRACONY
    US forces occupy the Black Sea Fleet base. Survivors withdraw east.: Amerykanie zajmują bazę Floty
      Czarnomorskiej. Ocalali wycofują się na wschód.
    SEVASTOPOL ENCIRCLED: SEWASTOPOL OKRĄŻONY
    US forces hold the corridor from Kacha to Balaklava. The garrison is cut off.: Amerykanie kontrolują
      korytarz od Kaczy do Bałakławy. Garnizon został odcięty.
    SEVASTOPOL HELD: SEWASTOPOL UTRZYMANY
    Sevastopol remains Soviet. Encirclement is incomplete; the land routes still need protection.: Sewastopol
      pozostaje radziecki. Okrążenie jest niepełne; drogi lądowe nadal wymagają ochrony.
    BEACHHEAD DESTROYED: PRZYCZÓŁEK ZLIKWIDOWANY
    Kacha has been retaken. The US sea supply route is broken.: Kaczę odbito. Amerykańska morska droga
      zaopatrzenia została przerwana.
    BEACHHEAD REMAINS: PRZYCZÓŁEK POZOSTAJE
    US forces still hold Kacha, but their advance has stalled. Reserves move west.: Amerykanie nadal utrzymują
      Kaczę, ale ich natarcie utknęło. Rezerwy przemieszczają się na zachód.
    BREAKTHROUGH IN CRIMEA: WYŁOM NA KRYMIE
    US forces hold Kacha and Simferopol. The 157th Division's route is severed.: Amerykanie kontrolują
      Kaczę i Symferopol. Droga 157. Dywizji jest odcięta.
    Second SEAL Detachment: Drugi oddział SEAL
    Choose the second SEAL landing zone. Kacha reinforces the beachhead; Balaklava enables an unsupplied deep raid.: Wybierz
      miejsce lądowania drugiego oddziału SEAL. Kacza wzmacnia przyczółek; Bałakława umożliwia głęboki
      rajd bez zaopatrzenia.
    Secure the Beach: Zabezpieczyć plażę
    Land at Kacha beside the supply line.: Wyląduj w Kaczy przy linii zaopatrzenia.
    Deep Raid: Głęboki rajd
    Land at Balaklava without supply.: Wyląduj w Bałakławie bez zaopatrzenia.
    Reserve Regiment Ready: Pułk rezerwowy gotowy
    Three Black Sea Fleet reserve battalions are available in one Sevastopol reinforcement card.: Trzy
      bataliony rezerwy Floty Czarnomorskiej są dostępne na jednej karcie posiłków w Sewastopolu.
    '157th: 91st Regiment': '157. Dywizja: 91. pułk'
    The 91st Motor Rifle Regiment reaches Simferopol. Keep the Bakhchysarai road open.: 91. pułk zmotoryzowany
      przybywa przez Symferopol. Utrzymaj przejezdną drogę przez Bachczysaraj.
    Division Reserve: Rezerwa dywizyjna
    The 2nd Marine Division HQ and a detached M1A1 battalion reach the beachhead.: Sztab 2. Dywizji Piechoty
      Morskiej i przydzielony batalion M1A1 docierają na przyczółek.
    Air Reinforcements: Posiłki lotnicze
    ? Odessa Military District is sending another air group to Crimea. Request MiG-27s to strike armor
      or Su-25s to support the troops.
    : Odeski Okręg Wojskowy wysyła kolejną grupę lotniczą na Krym. Wybierz MiG-27 do ataków na pancerz
      lub Su-25 do wsparcia wojsk.
    MiG-27: MiG-27
    Four MiG-27s will strike armor and defensive positions.: Cztery MiG-27 zaatakują pojazdy pancerne
      i pozycje obronne.
    Su-25: Su-25
    Su-25s will support naval infantry and counterattacks near Sevastopol.: Su-25 wesprą piechotę morską
      i kontrataki pod Sewastopolem.
    Carrier Withdraws: Lotniskowiec się wycofuje
    Carrier Damaged: Lotniskowiec uszkodzony
    Frontline Wings Redeployed: Grupy z frontu przerzucone
    Soviet Air Reinforcements: Radzieckie posiłki lotnicze
    The USSR continues deploying aviation in the sector. Intelligence reports new Su-24 and MiG-23 groups at the rear airbase.: ZSRR
      kontynuuje rozbudowę lotnictwa w sektorze. Wywiad donosi o nowych grupach Su-24 i MiG-23 na tyłowym
      lotnisku.
    Deployment Prevented: Rozwinięcie udaremnione
    ? Simferopol was seized before the 157th could deploy. You intercepted its unloading and supply hub
      in time; the division will not reach Sevastopol.
    : Symferopol zdobyto przed rozwinięciem 157. Dywizji. W porę zajęto jej węzeł wyładunku i zaopatrzenia;
      dywizja nie dotrze do Sewastopola.
    157th Division Deploys: 157. Dywizja się rozwija
    ? Simferopol was not captured in time. Soviet regimental groups have begun deploying; expect stronger
      defenses and counterattacks along the Bakhchysarai road.
    : Symferopola nie zdobyto na czas. Radzieckie zgrupowania pułkowe rozpoczęły rozwinięcie; spodziewaj
      się wzmocnionej obrony i kontrataków na drodze przez Bachczysaraj.
    ? 'Date: 7 September 1989

      Duration: 20 turns

      Area: Kacha — Belbek — Sevastopol, Crimea


      With both alliances committed in Central Europe, US command opens a new front on the Black Sea.
      The 2nd Marine Division lands at Kacha to secure its beachhead, break through Belbek and seize Sevastopol.


      The Black Sea Fleet is caught during mobilization. The 810th Naval Infantry Brigade faces the first
      assault while local garrisons buy time. Incomplete regimental groups of the 157th Motor Rifle Division
      assemble at Simferopol and enter the battle in successive waves.


      NATO must capture Sevastopol; the USSR must retake Kacha and break the landing. Taking Simferopol
      blocks Soviet divisional reinforcements. If neither decisive objective is achieved by turn 20, the
      operation ends in failure for the American invasion.'
    : 'Data: 7 września 1989

      Czas: 20 tur

      Obszar: Kacza — Belbek — Sewastopol, Krym


      Gdy oba sojusze są zaangażowane w Europie Środkowej, amerykańskie dowództwo otwiera nowy front nad
      Morzem Czarnym. 2. Dywizja Piechoty Morskiej ląduje w Kaczy, by zabezpieczyć przyczółek, przełamać
      Belbek i zdobyć Sewastopol.


      Flota Czarnomorska zostaje zaskoczona w trakcie mobilizacji. 810. Brygada Piechoty Morskiej przyjmuje
      pierwsze uderzenie, a miejscowe garnizony zyskują czas. Niepełne zgrupowania pułkowe 157. Dywizji
      Zmotoryzowanej zbierają się w Symferopolu i wchodzą do walki kolejnymi falami.


      NATO musi zdobyć Sewastopol; ZSRR musi odbić Kaczę i rozbić desant. Zajęcie Symferopola blokuje
      radzieckie posiłki dywizyjne. Brak osiągnięcia decydującego celu do 20. tury oznacza fiasko amerykańskiej
      inwazji.'
    ? 'Principal forces:


      #US 2nd Marine Division

      #US 6th and 8th Marines

      #US 2nd Tank Battalion and attached M1A1s

      #US 10th Marines artillery

      #US Navy SEAL and helicopter groups


      #US Carrier aviation and I-HAWK'
    : 'Główne siły:


      #US 2. Dywizja Piechoty Morskiej

      #US 6. i 8. pułk piechoty morskiej

      #US 2. batalion czołgów i przydzielone M1A1

      #US Artyleria 10. pułku

      #US Navy SEAL i grupy śmigłowców


      #US Lotnictwo pokładowe i I-HAWK'
    ? 'Principal forces:


      #SOV 810th Naval Infantry Brigade

      #SOV 157th Motor Rifle Division

      #SOV 60th Air Defence Corps

      #SOV Black Sea Fleet garrisons and reserves

      #SOV Kacha territorial defence


      #SOV Soviet aviation'
    : 'Główne siły:


      #SOV 810. Brygada Piechoty Morskiej

      #SOV 157. Dywizja Zmotoryzowana

      #SOV 60. Korpus Obrony Powietrznej

      #SOV Garnizony i rezerwy Floty Czarnomorskiej

      #SOV Obrona terytorialna Kaczy


      #SOV Lotnictwo radzieckie'
    ? 'Hold Sevastopol until the operation ends. Retaking Kacha immediately defeats the landing.


      Bakhchysarai guards the road from Simferopol. If the Americans seize Simferopol before turn nine
      begins, the 157th cannot deploy.


      Preserve the regular battalions for a counterattack. District aviation will support you when it
      arrives.'
    : 'Utrzymaj Sewastopol do końca operacji. Odbicie Kaczy natychmiast rozbija desant.


      Bachczysaraj osłania drogę z Symferopola. Jeśli Amerykanie zajmą Symferopol przed rozpoczęciem dziewiątej
      tury, 157. Dywizja nie zdoła się rozwinąć.


      Zachowaj regularne bataliony do kontrataku. Lotnictwo okręgu udzieli wsparcia po przybyciu.'
    ? 'Capture Sevastopol before the twenty-turn operation ends. Hold Kacha: losing the beachhead immediately
      defeats the landing.


      Belbek opens the northern approach; Balaklava opens the southern route. Taking Simferopol before
      turn nine begins prevents the Soviet 157th Division from deploying.


      Move quickly while you hold the advantage.'
    : 'Zdobądź Sewastopol przed końcem dwudziestoturowej operacji. Utrzymaj Kaczę: utrata przyczółka natychmiast
      oznacza porażkę desantu.


      Belbek otwiera północne podejście, a Bałakława południową drogę. Zajęcie Symferopola przed dziewiątą
      turą uniemożliwia rozwinięcie radzieckiej 157. Dywizji.


      Działaj szybko, dopóki masz przewagę.'
    ? Soviet submarines have damaged the carrier. It is withdrawing for repairs; F-14 and SEAD operations
      are suspended. The amphibious ships remain, and Harriers will continue supporting you. The entire
      operation is at risk. You have twenty hours — five turns — to take Sevastopol. Otherwise the landing
      will be declared a failure.
    : Radzieckie okręty podwodne uszkodziły lotniskowiec. Wycofuje się na remont; działania F-14 i grupy
      SEAD zostają wstrzymane. Okręty desantowe pozostają, a Harriery nadal zapewnią wsparcie. Cała operacja
      jest zagrożona. Masz dwadzieścia godzin — pięć tur — na zdobycie Sewastopola. W przeciwnym razie
      desant zostanie uznany za fiasko.
    ? 'Our submarines have damaged the American carrier and forced it to withdraw. F-14s and the SEAD
      group leave the sector; Harriers remain aboard the amphibious ships. The enemy operation is in jeopardy:
      they have twenty hours — five turns — to capture Sevastopol. Hold the city and defeat the invasion.'
    : 'Nasze okręty podwodne uszkodziły amerykański lotniskowiec i zmusiły go do wycofania. F-14 i grupa
      SEAD opuszczają sektor; Harriery pozostają na okrętach desantowych. Operacja przeciwnika jest zagrożona:
      ma dwadzieścia godzin — pięć tur — na zdobycie Sewastopola. Utrzymaj miasto i pokonaj inwazję.'
    ? Su-24 and MiG-23 wings have arrived directly from the front to defend Sevastopol. Both are at half
      strength and badly disorganized. Fuel and ammunition deliveries are only beginning, and the pilots
      are exhausted. Allow them at least a few hours of rest.
    : Grupy Su-24 i MiG-23 przybyły prosto z frontu, by bronić Sewastopola. Obie mają połowę stanu i są
      mocno zdezorganizowane. Dostawy paliwa i amunicji dopiero się zaczynają, a piloci są skrajnie zmęczeni.
      Daj im co najmniej kilka godzin odpoczynku.
    ? 'Commander, you have been assigned to lead the defense of Sevastopol.


      Only twelve hours ago, High Command confirmed that the Americans were preparing a major landing
      operation in Crimea.


      We were too late.


      Forward US Marine Corps units have already landed at Kacha and secured a foothold. Fighting to expand
      the beachhead continues.'
    : 'Dowódco, powierzono panu obronę Sewastopola.


      Zaledwie dwanaście godzin temu Naczelne Dowództwo potwierdziło, że Amerykanie przygotowują duży
      desant na Krymie.


      Spóźniliśmy się.


      Przednie oddziały amerykańskiej piechoty morskiej wylądowały już w Kaczy i umocniły się na wybrzeżu.
      Walki o poszerzenie przyczółka trwają.'
    ? 'The backbone of the defense remains the Black Sea Fleet’s 810th Independent Naval Infantry Brigade.


      Its units are dispersed between Kacha, Belbek, Sevastopol and Bakhchysarai.


      Composite fleet garrisons, border guards and rear-area personnel also come under your command.


      Soviet aircraft will be redeployed to Crimea, but air support is scarce for now.'
    : 'Trzon obrony nadal stanowi 810. Samodzielna Brygada Piechoty Morskiej Floty Czarnomorskiej.


      Jej oddziały są rozproszone między Kaczą, Belbekiem, Sewastopolem i Bachczysarajem.


      Pod pana dowództwo trafiają również zbiorcze garnizony floty, pogranicznicy i personel tyłów.


      Radzieckie samoloty zostaną przerzucone na Krym, ale na razie wsparcie powietrzne jest niewielkie.'
    ? 'The first American strike targeted Black Sea Fleet aviation.


      Kacha airfield has been devastated. Most aircraft and helicopters were destroyed on the ground.


      Surviving Mi-8s and Ka-29s have been assigned to the 881st Independent Assault Battalion.


      Airfield guards and surviving technical personnel form a separate defensive group.'
    : 'Pierwsze amerykańskie uderzenie było wymierzone w lotnictwo Floty Czarnomorskiej.


      Lotnisko Kacza zostało zdewastowane. Większość samolotów i śmigłowców zniszczono na ziemi.


      Ocalałe Mi-8 i Ka-29 przydzielono do 881. samodzielnego batalionu szturmowego.


      Ochrona lotniska i ocalali technicy tworzą odrębny oddział obronny.'
    ? 'Colonel, the first phase of the operation is complete.


      Marines have landed at Kacha and secured a beachhead.


      Soviet aviation at nearby airfields has been largely destroyed, while the main Black Sea Fleet force
      has been diverted toward Romania.


      The principal phase now begins: the advance on Sevastopol.'
    : 'Pułkowniku, pierwsza faza operacji została zakończona.


      Marines wylądowali w Kaczy i zabezpieczyli przyczółek.


      Radzieckie lotnictwo na pobliskich lotniskach zostało w większości zniszczone, a główne siły Floty
      Czarnomorskiej odciągnięto w stronę Rumunii.


      Teraz zaczyna się główna faza: natarcie na Sewastopol.'
    ? 'The landing force is built around units of II Marine Expeditionary Force.


      The 6th and 8th Marine Regiments form the first line.


      Armor, artillery and units of the 2nd Tank Battalion support them.


      An additional M1A1 tank group has been attached to break the Soviet defense.'
    : 'Trzon desantu stanowią jednostki II Korpusu Ekspedycyjnego Piechoty Morskiej.


      6. i 8. pułk piechoty morskiej tworzą pierwszy rzut.


      Wspierają je czołgi, artyleria oraz oddziały 2. batalionu czołgów.


      Dodatkowa grupa M1A1 została przydzielona do przełamania radzieckiej obrony.'
    ? 'Carrier aircraft continue operations over western Crimea.


      Marine helicopters provide troop transport, supply and close support.


      Soviet air activity is currently negligible.


      This advantage is temporary: the enemy is already redeploying aircraft from other sectors.'
    : 'Lotnictwo pokładowe nadal działa nad zachodnim Krymem.


      Śmigłowce marines zapewniają transport wojsk, zaopatrzenie i bezpośrednie wsparcie.


      Radziecka aktywność lotnicza jest obecnie znikoma.


      Ta przewaga jest chwilowa: przeciwnik już przerzuca samoloty z innych sektorów.'
    UNITED STATES — Attack: STANY ZJEDNOCZONE — Atak
    SOVIET UNION — Defense: ZWIĄZEK RADZIECKI — Obrona
    1st Air Assault Company: 1. kompania desantowa
    2nd Air Assault Company: 2. kompania desantowa
    3rd Air Assault Company: 3. kompania desantowa
