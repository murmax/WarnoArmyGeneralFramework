    Saky Air Landing: Luftlandung bei Saky
    Soviet Air Landing at Saky: Sowjetische Luftlandung bei Saky
    Tank Landing Disrupted: Panzerlandung vereitelt
    Two Air Assault Battalions: Zwei Luftlandebataillone
    ? Choose the defense conditions. Standard keeps the current forces. In the harder variant, the US
      2nd Tank Regiment receives M1 Abrams, while its attached force brings heavy M1A1s and a Marine company
      in fifteen Bradleys.
    : Wählen Sie die Verteidigungsbedingungen. Standard behält die bisherigen Kräfte bei. Im schwierigeren
      Szenario erhält das 2. US-Panzerregiment M1 Abrams; die angegliederte Kampfgruppe bringt schwere
      M1A1 und eine Marinekompanie auf fünfzehn Bradleys.
    ? Choose the operation conditions. Standard keeps the current forces. In the harder variant, the US
      tank landing is disrupted and two Soviet air assault battalions attack from Saky on turn five.
    : Wählen Sie die Bedingungen der Operation. Standard behält die bisherigen Kräfte bei. Im schwierigeren
      Szenario fällt die US-Panzerlandung aus, und im fünften Zug greifen zwei sowjetische Luftlandebataillone
      aus Richtung Saky an.
    ? The 2nd Marine Division HQ and logistics services are available at the beachhead. Review the arriving
      division reserve card.
    : Der Stab der 2. Marinedivision und die Versorgungskräfte sind am Brückenkopf verfügbar. Prüfen Sie
      die eingetroffene Karte der Divisionsreserve.
    ? 'Soviet coastal anti-ship missiles have sunk the tank landing ship carrying the heavy armor. The
      2nd Tank Regiment and detached M1A1 battalion will not land: the Marines must advance with air and
      artillery support. An emergency Soviet helicopter force has already departed Odessa Military District.
      Two battalions will arrive from Saky on turn five and try to cut the Kacha beachhead. Protect your
      northern flank and sea supply line.'
    : 'Sowjetische Küstenbatterien haben das Landungsschiff mit der schweren Panzertechnik durch Seezielflugkörper
      versenkt. Das 2. Panzerregiment und das angegliederte M1A1-Bataillon werden nicht landen: Die Marines
      müssen mit Luft- und Artillerieunterstützung vorstoßen. Eine sowjetische Hubschraubertruppe ist
      bereits aus dem Militärbezirk Odessa gestartet. Im fünften Zug werden zwei Bataillone aus Richtung
      Saky versuchen, den Brückenkopf bei Kacha abzuschneiden. Sichern Sie die Nordflanke und den Nachschub
      über See.'
    ? Intelligence reports that the Americans will land three tank battalions equipped with modern tanks
      within the next twenty-four hours. Strengthen the anti-tank lines and prepare your reserves — the
      enemy intends to break through to Sevastopol.
    : Die Aufklärung meldet, dass die Amerikaner innerhalb der nächsten vierundzwanzig Stunden drei Bataillone
      mit modernen Panzern anlanden werden. Verstärken Sie die Panzerabwehrstellungen und halten Sie Ihre
      Reserven bereit — der Feind will nach Sewastopol durchbrechen.
    ? Two Soviet air assault battalions have reached the Saky sector. Mi-8s have brought infantry and
      supplies, while Mi-24s cover their advance toward Kacha. The enemy intends to cut your forward units
      off from the coast. Secure the approaches to the beachhead immediately.
    : Zwei sowjetische Luftlandebataillone haben den Raum Saky erreicht. Mi-8 brachten Infanterie und
      Nachschub, Mi-24 decken den Vorstoß auf Kacha. Der Feind will Ihre vorderen Truppen von der Küste
      abschneiden. Sichern Sie sofort die Zugänge zum Brückenkopf.
    Difficulty: Schwierigkeit
    Choose the difficulty level.: Wählen Sie den Schwierigkeitsgrad.
    Normal: Normal
    Harsh: Hart
    For a first campaign.: Zum Kennenlernen der Kampagne.
    For experienced commanders.: Für erfahrene Kommandeure.
    ? 'Date: 7 September 1989

      Duration: 20 turns

      Area: Kacha — Belbek — Sevastopol, Crimea


      With both alliances committed in Central Europe, US command opens a new front on the Black Sea.
      The 2nd Marine Division lands at Kacha to secure its beachhead, break through Belbek and seize Sevastopol.


      The Black Sea Fleet is caught during mobilization. The 810th Naval Infantry Brigade faces the first
      assault while local garrisons buy time. Incomplete regimental groups of the 157th Motor Rifle Division
      assemble at Simferopol and enter the battle in successive waves.


      NATO must capture Sevastopol; the USSR must retake Kacha and break the landing. Taking Simferopol
      blocks Soviet divisional reinforcements. If neither decisive objective is achieved by turn 20, the
      operation ends in failure for the American invasion.


      Losing Kacha does not end the campaign immediately: US forces can retake the beachhead before the
      operation deadline.'
    : 'Datum: 7. September 1989

      Dauer: 20 Runden

      Gebiet: Katscha — Belbek — Sewastopol, Krim


      Während beide Bündnisse in Mitteleuropa gebunden sind, eröffnet die amerikanische Führung eine neue
      Front am Schwarzen Meer. Die 2. Marineinfanteriedivision landet bei Katscha, um den Brückenkopf
      zu sichern, Belbek zu durchbrechen und Sewastopol einzunehmen.


      Die Schwarzmeerflotte wird während ihrer Mobilisierung überrascht. Die 810. Marineinfanteriebrigade
      fängt den ersten Schlag ab, während örtliche Garnisonen Zeit gewinnen. Unvollständige Regimentsgruppen
      der 157. Mot.-Schützen-Division sammeln sich in Simferopol und greifen in aufeinanderfolgenden Wellen
      ein.


      Die NATO muss Sewastopol einnehmen; die UdSSR muss Katscha zurückerobern und die Landung zerschlagen.
      Simferopols Eroberung blockiert sowjetische Divisionsverstärkungen. Wird das entscheidende Ziel
      bis Runde 20 nicht erreicht, scheitert die amerikanische Invasion.


      Erobern Sie Sewastopol vor Beginn von Runde 20. Das Landungssicherungsbataillon bleibt in den Runden
      1–5 unbeweglich. Der Verlust von Katscha beendet den Feldzug nicht sofort: Erobern Sie den Brückenkopf
      vor Ablauf der Frist zurück.'
    Landing Security Battalion: Landungssicherung
    ? 'Hold Sevastopol until the operation deadline. Retake Kacha to cut US supply. Capturing the beachhead
      does not immediately end the campaign; US forces can counterattack before the deadline.


      Bakhchysarai guards the road from Simferopol. If the Americans seize Simferopol before turn nine
      begins, the 157th cannot deploy.


      Preserve the regular battalions for a counterattack. District aviation will support you when it
      arrives.'
    : 'Halten Sie Sewastopol bis zum Ende der Operation. Erobern Sie Katscha zurück, um den US-Nachschub
      abzuschneiden. Die Einnahme des Brückenkopfs beendet den Feldzug nicht sofort; US-Truppen können
      vor Fristende gegenangreifen.


      Bachtschyssaraj schützt die Straße aus Simferopol. Erobern die Amerikaner Simferopol vor Beginn
      der neunten Runde, kann die 157. Division nicht aufmarschieren.


      Schonen Sie reguläre Bataillone für einen Gegenangriff. Die Bezirksluftstreitkräfte unterstützen
      Sie nach ihrer Ankunft.'
    ? 'Capture Sevastopol before turn 20 begins. The landing security battalion cannot move during turns
      1–5. Losing Kacha does not end the campaign immediately: retake the beachhead before the deadline.


      Belbek opens the northern approach; Balaklava opens the southern route. Taking Simferopol before
      turn nine begins prevents the Soviet 157th Division from deploying.


      Move quickly while you hold the advantage.'
    : 'Erobern Sie Sewastopol vor Beginn von Runde 20. Das Landungssicherungsbataillon bleibt in den Runden
      1–5 unbeweglich. Der Verlust von Katscha beendet den Feldzug nicht sofort: Erobern Sie den Brückenkopf
      vor Ablauf der Frist zurück.


      Belbek öffnet den nördlichen Zugang, Balaklawa den südlichen Weg. Die Eroberung Simferopols vor
      Beginn der neunten Runde verhindert den Aufmarsch der sowjetischen 157. Division.


      Handeln Sie schnell, solange Sie im Vorteil sind.'
