    'Kacha: Defense of Sevastopol': 'Kacha: defensa de Sebastopol'
    'NATO: take Sevastopol. USSR: retake Kacha.': 'OTAN: tomar Sebastopol. URSS: recuperar Kacha.'
    '#US #SOV #medium{BLACK SEA — SEPTEMBER 1989} Kacha: Defense of Sevastopol': '#US #SOV #medium{MAR
      NEGRO — SEPTIEMBRE DE 1989} Kacha: defensa de Sebastopol'
    Amphibious landing against the Black Sea Fleet base: Desembarco contra la base de la Flota del Mar
      Negro
    DEFENSE OF SEVASTOPOL: DEFENSA DE SEBASTOPOL
    ? Commander, you now lead the defense of Sevastopol. The Kacha landing has begun, but the main American
      force is still coming ashore.
    : Comandante, queda al mando de la defensa de Sebastopol. El desembarco en Kacha ha comenzado, pero
      el grueso de las fuerzas estadounidenses aún está llegando a tierra.
    THE 810TH BRIGADE: LA 810.ª BRIGADA
    ? Naval infantry protects Belbek, Bakhchysarai and Sevastopol. Facility guards are weaker; use them
      to preserve regular battalions for the decisive fight.
    : La infantería de marina protege Belbek, Bajchisarái y Sebastopol. Las guardias de instalaciones
      son más débiles; úselas para reservar los batallones regulares para el combate decisivo.
    AIRFIELDS HIT: AERÓDROMOS ATACADOS
    ? The first strike crippled Kacha airfield and destroyed most aircraft on the ground. Surviving helicopters
      joined the 881st Assault Battalion while the airfield guard still fights.
    : El primer ataque inutilizó el aeródromo de Kacha y destruyó la mayoría de los aparatos en tierra.
      Los helicópteros supervivientes se incorporaron al 881.º Batallón de Asalto; la guardia del aeródromo
      sigue combatiendo.
    157TH MOTOR RIFLE DIVISION: 157.ª DIVISIÓN MOTORIZADA
    CRIMEAN BEACHHEAD: CABEZA DE PLAYA EN CRIMEA
    ? Colonel, the first landing wave has secured a foothold. Soviet outposts still resist, but the sea
      route for follow-on echelons is open.
    : Coronel, la primera oleada ha asegurado un punto de apoyo. Los puestos soviéticos aún resisten,
      pero la ruta marítima para los siguientes escalones está abierta.
    INVASION FORCE: FUERZA DE INVASIÓN
    ? Infantry has amphibious vehicles, engineers and air defense. Heavy tanks follow later; open the
      exits from the beach before the Soviet line closes.
    : La infantería cuenta con vehículos anfibios, ingenieros y defensa antiaérea. Los carros pesados
      llegarán después; abra las salidas de la playa antes de que se cierre la línea soviética.
    THE FLEET SUPPORTS THE ADVANCE: LA FLOTA APOYA EL AVANCE
    ? Carrier aircraft control western Crimea for now. Helicopters move reconnaissance and support the
      Marines; Soviet aircraft may return from other airfields.
    : La aviación embarcada domina por ahora el oeste de Crimea. Los helicópteros transportan exploradores
      y apoyan a los Marines; los aviones soviéticos pueden regresar desde otras bases.
    TIME IS AGAINST US: EL TIEMPO CORRE EN CONTRA
    VICTORY: VICTORIA
    Sevastopol has fallen. The landing force achieved its main objective; command approves the next phase.: Sebastopol
      ha caído. La fuerza de desembarco ha cumplido su objetivo principal; el mando autoriza la siguiente
      fase.
    OPERATION STALLED: OPERACIÓN ESTANCADA
    ? Sevastopol was not taken in time. No further American reinforcements will come; approaching Soviet
      reserves force the landing to prepare its defense.
    : Sebastopol no fue tomada a tiempo. No llegarán más refuerzos estadounidenses; las reservas soviéticas
      que se aproximan obligan al desembarco a preparar su defensa.
    OPERATION FAILED: OPERACIÓN FRACASADA
    ? Sevastopol has not fallen. The landing failed to achieve its main objective, and command is terminating
      the operation. Holding the beachhead cannot change the outcome.
    : Sebastopol no ha caído. El desembarco no logró su objetivo principal y el mando da por terminada
      la operación. Mantener la cabeza de playa ya no puede cambiar el desenlace.
    SEVASTOPOL TAKEN: SEBASTOPOL TOMADA
    Marines occupy the Black Sea Fleet base. The main objective is complete.: Los Marines ocupan la base
      de la Flota del Mar Negro. El objetivo principal está cumplido.
    SEVASTOPOL ISOLATED: SEBASTOPOL AISLADA
    We hold the Kacha–Balaklava corridor. The city's land routes are cut.: Controlamos el corredor Kacha–Balaklava.
      Las rutas terrestres de la ciudad están cortadas.
    SEVASTOPOL HOLDS: SEBASTOPOL RESISTE
    Sevastopol has not been taken or completely isolated. An assault would require extending the operation.: Sebastopol
      no ha sido tomada ni aislada por completo. Un asalto exigiría prolongar la operación.
    BEACHHEAD LOST: CABEZA DE PLAYA PERDIDA
    Soviet forces retook Kacha. The ground force can no longer be supplied at scale.: Las fuerzas soviéticas
      recuperaron Kacha. Ya no es posible abastecer a gran escala a las fuerzas terrestres.
    BEACHHEAD HELD: CABEZA DE PLAYA MANTENIDA
    Kacha remains ours. Sea supply continues, but the offensive has lost momentum.: Kacha sigue en nuestras
      manos. Continúa el abastecimiento marítimo, pero la ofensiva ha perdido impulso.
    CRIMEAN BREAKTHROUGH: RUPTURA EN CRIMEA
    Kacha and Simferopol are ours. Soviet reserve movement is disrupted.: Kacha y Simferópol son nuestras.
      El movimiento de las reservas soviéticas está interrumpido.
    ? Sevastopol has held. Soviet forces have denied the American invasion its main objective. The enemy
      no longer has time for a decisive assault.
    : Sebastopol ha resistido. Las fuerzas soviéticas frustraron el objetivo principal de la invasión
      estadounidense. El enemigo ya no dispone de tiempo para un asalto decisivo.
    DEFENSE CONTINUES: LA DEFENSA CONTINÚA
    ? Sevastopol holds, but the landing remains in Crimea. Clearing the beachhead will require diverting
      additional reserves from other fronts.
    : Sebastopol resiste, pero el desembarco permanece en Crimea. Eliminar la cabeza de playa exigirá
      desviar más reservas de otros frentes.
    DEFENSE BROKEN: DEFENSA ROTA
    Sevastopol is lost. Surviving units withdraw toward Simferopol and prepare a counterattack.: Sebastopol
      está perdida. Las unidades supervivientes se retiran hacia Simferópol y preparan un contraataque.
    SEVASTOPOL LOST: SEBASTOPOL PERDIDA
    US forces occupy the Black Sea Fleet base. Survivors withdraw east.: Las fuerzas estadounidenses ocupan
      la base de la Flota del Mar Negro. Los supervivientes se retiran al este.
    SEVASTOPOL ENCIRCLED: SEBASTOPOL RODEADA
    US forces hold the corridor from Kacha to Balaklava. The garrison is cut off.: Los estadounidenses
      controlan el corredor de Kacha a Balaklava. La guarnición está aislada.
    SEVASTOPOL HELD: SEBASTOPOL MANTENIDA
    Sevastopol remains Soviet. Encirclement is incomplete; the land routes still need protection.: Sebastopol
      sigue siendo soviética. El cerco es incompleto; las rutas terrestres aún deben protegerse.
    BEACHHEAD DESTROYED: CABEZA DE PLAYA ELIMINADA
    Kacha has been retaken. The US sea supply route is broken.: Kacha ha sido recuperada. La ruta de abastecimiento
      marítimo estadounidense está cortada.
    BEACHHEAD REMAINS: LA CABEZA DE PLAYA PERSISTE
    US forces still hold Kacha, but their advance has stalled. Reserves move west.: Los estadounidenses
      aún mantienen Kacha, pero su avance se ha detenido. Las reservas se desplazan al oeste.
    BREAKTHROUGH IN CRIMEA: BRECHA EN CRIMEA
    US forces hold Kacha and Simferopol. The 157th Division's route is severed.: Los estadounidenses controlan
      Kacha y Simferópol. La ruta de la 157.ª División está cortada.
    Second SEAL Detachment: Segundo Destacamento SEAL
    Choose the second SEAL landing zone. Kacha reinforces the beachhead; Balaklava enables an unsupplied deep raid.: Elija
      la zona de inserción del segundo destacamento SEAL. Kacha refuerza la cabeza de playa; Balaklava
      permite una incursión profunda sin abastecimiento.
