      batallones de reserva de la Flota del Mar Negro están disponibles en una única tarjeta de refuerzo
      en Sebastopol.
    '157th: 91st Regiment': '157.ª División: 91.º Regimiento'
    The 91st Motor Rifle Regiment reaches Simferopol. Keep the Bakhchysarai road open.: El 91.º Regimiento
      Motorizado llega por Simferópol. Mantenga abierta la carretera de Bajchisarái.
    Division Reserve: Reserva divisionaria
    The 2nd Marine Division HQ and a detached M1A1 battalion reach the beachhead.: La plana mayor de la
      2.ª División de Marines y un batallón M1A1 agregado llegan a la cabeza de playa.
    Air Reinforcements: Refuerzos aéreos
    ? Odessa Military District is sending another air group to Crimea. Request MiG-27s to strike armor
      or Su-25s to support the troops.
    : El distrito militar de Odesa envía otro grupo aéreo a Crimea. Solicite MiG-27 contra los blindados
      o Su-25 para apoyar a las tropas.
    MiG-27: MiG-27
    Four MiG-27s will strike armor and defensive positions.: Cuatro MiG-27 atacarán blindados y posiciones
      defensivas.
    Su-25: Su-25
    Su-25s will support naval infantry and counterattacks near Sevastopol.: Los Su-25 apoyarán a la infantería
      de marina y los contraataques cerca de Sebastopol.
    Carrier Withdraws: El portaaviones se retira
    Carrier Damaged: Portaaviones dañado
    Frontline Wings Redeployed: Grupos del frente redesplegados
    Soviet Air Reinforcements: Refuerzos aéreos soviéticos
    The USSR continues deploying aviation in the sector. Intelligence reports new Su-24 and MiG-23 groups at the rear airbase.: La
      URSS continúa desplegando aviación en el sector. Inteligencia informa de nuevos grupos de Su-24
      y MiG-23 en el aeródromo de retaguardia.
    Deployment Prevented: Despliegue impedido
    ? Simferopol was seized before the 157th could deploy. You intercepted its unloading and supply hub
      in time; the division will not reach Sevastopol.
    : Simferópol fue tomada antes del despliegue de la 157.ª División. Interceptó a tiempo su nodo de
      descarga y suministro; la división no llegará a Sebastopol.
    157th Division Deploys: La 157.ª División se despliega
    ? Simferopol was not captured in time. Soviet regimental groups have begun deploying; expect stronger
      defenses and counterattacks along the Bakhchysarai road.
    : Simferópol no fue tomada a tiempo. Los grupos de regimiento soviéticos comienzan su despliegue;
      espere defensas reforzadas y contraataques en la carretera de Bajchisarái.
    ? 'Date: 7 September 1989

      Duration: 20 turns

      Area: Kacha — Belbek — Sevastopol, Crimea


      With both alliances committed in Central Europe, US command opens a new front on the Black Sea.
      The 2nd Marine Division lands at Kacha to secure its beachhead, break through Belbek and seize Sevastopol.


      The Black Sea Fleet is caught during mobilization. The 810th Naval Infantry Brigade faces the first
      assault while local garrisons buy time. Incomplete regimental groups of the 157th Motor Rifle Division
      assemble at Simferopol and enter the battle in successive waves.


      NATO must capture Sevastopol; the USSR must retake Kacha and break the landing. Taking Simferopol
      blocks Soviet divisional reinforcements. If neither decisive objective is achieved by turn 20, the
      operation ends in failure for the American invasion.'
    : 'Fecha: 7 de septiembre de 1989

      Duración: 20 turnos

      Zona: Kacha — Belbek — Sebastopol, Crimea


      Con ambas alianzas comprometidas en Europa Central, el mando estadounidense abre un nuevo frente
      en el Mar Negro. La 2.ª División de Marines desembarca en Kacha para asegurar su cabeza de playa,
      romper la defensa de Belbek y tomar Sebastopol.


      La Flota del Mar Negro es sorprendida durante la movilización. La 810.ª Brigada de Infantería de
      Marina recibe el primer golpe mientras las guarniciones locales ganan tiempo. Grupos incompletos
      de la 157.ª División Motorizada se concentran en Simferópol y entran en combate por oleadas.


      La OTAN debe tomar Sebastopol; la URSS debe recuperar Kacha y derrotar el desembarco. Tomar Simferópol
      bloquea los refuerzos divisionarios soviéticos. Sin lograr el objetivo decisivo al llegar al turno
      20, la invasión estadounidense fracasa.'
    ? 'Principal forces:


      #US 2nd Marine Division

      #US 6th and 8th Marines

      #US 2nd Tank Battalion and attached M1A1s

      #US 10th Marines artillery

      #US Navy SEAL and helicopter groups


      #US Carrier aviation and I-HAWK'
    : 'Fuerzas principales:


      #US 2.ª División de Marines

      #US 6.º y 8.º Regimientos de Marines

      #US 2.º Batallón de Carros y M1A1 agregados

      #US Artillería del 10.º Regimiento

      #US Navy SEAL y grupos de helicópteros


      #US Aviación embarcada e I-HAWK'
    ? 'Principal forces:


      #SOV 810th Naval Infantry Brigade

      #SOV 157th Motor Rifle Division

      #SOV 60th Air Defence Corps

      #SOV Black Sea Fleet garrisons and reserves

      #SOV Kacha territorial defence


      #SOV Soviet aviation'
    : 'Fuerzas principales:


      #SOV 810.ª Brigada de Infantería de Marina

      #SOV 157.ª División Motorizada

      #SOV 60.º Cuerpo de Defensa Aérea

      #SOV Guarniciones y reservas de la Flota del Mar Negro

      #SOV Defensa territorial de Kacha


      #SOV Aviación soviética'
    ? 'Hold Sevastopol until the operation ends. Retaking Kacha immediately defeats the landing.


      Bakhchysarai guards the road from Simferopol. If the Americans seize Simferopol before turn nine
      begins, the 157th cannot deploy.


      Preserve the regular battalions for a counterattack. District aviation will support you when it
      arrives.'
    : 'Mantenga Sebastopol hasta el final de la operación. Recuperar Kacha derrota inmediatamente al desembarco.


      Bajchisarái protege la carretera de Simferópol. Si los estadounidenses toman Simferópol antes de
      comenzar el noveno turno, la 157.ª División no podrá desplegarse.


      Reserve los batallones regulares para un contraataque. La aviación del distrito le apoyará cuando
      llegue.'
    ? 'Capture Sevastopol before the twenty-turn operation ends. Hold Kacha: losing the beachhead immediately
      defeats the landing.


      Belbek opens the northern approach; Balaklava opens the southern route. Taking Simferopol before
      turn nine begins prevents the Soviet 157th Division from deploying.


      Move quickly while you hold the advantage.'
    : 'Tome Sebastopol antes de que termine la operación de veinte turnos. Mantenga Kacha: perder la cabeza
      de playa derrota inmediatamente al desembarco.


      Belbek abre el acceso norte; Balaklava, la ruta sur. Tomar Simferópol antes del noveno turno impide
      desplegar a la 157.ª División soviética.


      Avance con rapidez mientras tenga la ventaja.'
    ? Soviet submarines have damaged the carrier. It is withdrawing for repairs; F-14 and SEAD operations
      are suspended. The amphibious ships remain, and Harriers will continue supporting you. The entire
      operation is at risk. You have twenty hours — five turns — to take Sevastopol. Otherwise the landing
      will be declared a failure.
    : Submarinos soviéticos han dañado el portaaviones. Se retira para reparaciones; se suspenden las
      operaciones de F-14 y SEAD. Los buques anfibios permanecen y los Harrier seguirán apoyándole. Toda
      la operación está en peligro. Tiene veinte horas — cinco turnos — para tomar Sebastopol. De lo contrario,
      el desembarco será declarado un fracaso.
    ? 'Our submarines have damaged the American carrier and forced it to withdraw. F-14s and the SEAD
      group leave the sector; Harriers remain aboard the amphibious ships. The enemy operation is in jeopardy:
      they have twenty hours — five turns — to capture Sevastopol. Hold the city and defeat the invasion.'
    : 'Nuestros submarinos han dañado el portaaviones estadounidense y lo han obligado a retirarse. Los
      F-14 y el grupo SEAD abandonan el sector; los Harrier permanecen en los buques anfibios. La operación
      enemiga peligra: disponen de veinte horas — cinco turnos — para tomar Sebastopol. Mantenga la ciudad
      y frustre la invasión.'
    ? Su-24 and MiG-23 wings have arrived directly from the front to defend Sevastopol. Both are at half
      strength and badly disorganized. Fuel and ammunition deliveries are only beginning, and the pilots
      are exhausted. Allow them at least a few hours of rest.
    : Grupos de Su-24 y MiG-23 llegan directamente del frente para defender Sebastopol. Ambos están a
      media fuerza y muy desorganizados. Las entregas de combustible y munición apenas comienzan; los
      pilotos están exhaustos. Concédales al menos unas horas de descanso.
    ? 'Commander, you have been assigned to lead the defense of Sevastopol.


      Only twelve hours ago, High Command confirmed that the Americans were preparing a major landing
      operation in Crimea.


      We were too late.


      Forward US Marine Corps units have already landed at Kacha and secured a foothold. Fighting to expand
      the beachhead continues.'
    : 'Comandante, se le ha encomendado dirigir la defensa de Sebastopol.


      Hace apenas doce horas, el Alto Mando confirmó que los estadounidenses preparaban una gran operación
      de desembarco en Crimea.


      Llegamos demasiado tarde.


      Las unidades avanzadas de Marines ya han desembarcado en Kacha y se han afianzado en la costa. Los
      combates para ampliar la cabeza de playa continúan.'
    ? 'The backbone of the defense remains the Black Sea Fleet’s 810th Independent Naval Infantry Brigade.


      Its units are dispersed between Kacha, Belbek, Sevastopol and Bakhchysarai.


      Composite fleet garrisons, border guards and rear-area personnel also come under your command.


      Soviet aircraft will be redeployed to Crimea, but air support is scarce for now.'
    : 'La defensa sigue apoyándose en la 810.ª Brigada Independiente de Infantería de Marina de la Flota
      del Mar Negro.


      Sus unidades están dispersas entre Kacha, Belbek, Sebastopol y Bajchisarái.


      También quedan a sus órdenes guarniciones mixtas de la flota, guardias fronterizos y personal de
      retaguardia.


      La aviación soviética será redesplegada a Crimea, pero el apoyo aéreo escasea por ahora.'
    ? 'The first American strike targeted Black Sea Fleet aviation.


      Kacha airfield has been devastated. Most aircraft and helicopters were destroyed on the ground.


      Surviving Mi-8s and Ka-29s have been assigned to the 881st Independent Assault Battalion.


      Airfield guards and surviving technical personnel form a separate defensive group.'
    : 'El primer ataque estadounidense se dirigió contra la aviación de la Flota del Mar Negro.


      El aeródromo de Kacha quedó devastado. La mayoría de los aviones y helicópteros fueron destruidos
      en tierra.


      Los Mi-8 y Ka-29 supervivientes se asignaron al 881.º Batallón Independiente de Asalto.


      Los guardias y técnicos supervivientes del aeródromo forman un grupo defensivo separado.'
    ? 'Colonel, the first phase of the operation is complete.


      Marines have landed at Kacha and secured a beachhead.


      Soviet aviation at nearby airfields has been largely destroyed, while the main Black Sea Fleet force
      has been diverted toward Romania.


      The principal phase now begins: the advance on Sevastopol.'
    : 'Coronel, la primera fase de la operación ha concluido.


      Los Marines han desembarcado en Kacha y asegurado una cabeza de playa.


      La aviación soviética de los aeródromos cercanos ha sido destruida en gran parte, mientras que el
      grueso de la Flota del Mar Negro fue desviado hacia Rumanía.


      Comienza la fase principal: el avance sobre Sebastopol.'
    ? 'The landing force is built around units of II Marine Expeditionary Force.


      The 6th and 8th Marine Regiments form the first line.


      Armor, artillery and units of the 2nd Tank Battalion support them.


      An additional M1A1 tank group has been attached to break the Soviet defense.'
    : 'La fuerza de desembarco se articula en torno a unidades de la II Fuerza Expedicionaria de Marines.


      Los Regimientos 6.º y 8.º forman la primera línea.


      Blindados, artillería y unidades del 2.º Batallón de Carros les prestan apoyo.


      Se ha agregado un grupo adicional de M1A1 para romper la defensa soviética.'
    ? 'Carrier aircraft continue operations over western Crimea.


      Marine helicopters provide troop transport, supply and close support.


      Soviet air activity is currently negligible.


      This advantage is temporary: the enemy is already redeploying aircraft from other sectors.'
    : 'La aviación embarcada continúa operando sobre el oeste de Crimea.


      Los helicópteros de Marines proporcionan transporte, abastecimiento y apoyo cercano.


      La actividad aérea soviética es actualmente mínima.


      Esta ventaja es temporal: el enemigo ya está trasladando aviones desde otros sectores.'
