    Odessa Air Assault Bn 2: 敖德萨第2空中突击营
    Odessa Airmobile: 敖德萨空中机动部队
    Odessa Airmobile Force: 敖德萨空中机动部队
    Odessa Airmobile Group: 敖德萨空中突击集群
