    Detached Heavy Tank Bn: Btn. blindé lourd détaché
    HQ and Heavy Armor: EM et blindés lourds
    Helicopter Escort: Escorte héliportée
    Keep Standard: Conserver la version normale
    Make It Harder: Corser la campagne
    Marine M1s and Air Defense: M1 des Marines et DCA
    Mechanized Marine Company: Cie mécanisée des Marines
    Odessa Air Assault Bn 1: 1er btn. aéroporté d'Odessa
    Odessa Air Assault Bn 2: 2e btn. aéroporté d'Odessa
    Odessa Airmobile: Force aéroportée d'Odessa
    Odessa Airmobile Force: Force aéroportée d'Odessa
    Odessa Airmobile Group: Groupement aéroporté d'Odessa
    Operation Conditions: Conditions de l'opération
    Saky Air Landing: Débarquement aérien à Saki
    Soviet Air Landing at Saky: Débarquement soviétique à Saki
    Tank Landing Disrupted: Débarquement blindé compromis
    Two Air Assault Battalions: Deux bataillons aéroportés
    ? Choose the defense conditions. Standard keeps the current forces. In the harder variant, the US
      2nd Tank Regiment receives M1 Abrams, while its attached force brings heavy M1A1s and a Marine company
      in fifteen Bradleys.
    : Choisissez les conditions de la défense. La version normale conserve les forces actuelles. Dans
      la version difficile, le 2e régiment de chars américain reçoit des M1 Abrams, et son groupement
      détaché des M1A1 lourds et une compagnie de Marines sur quinze Bradley.
    ? Choose the operation conditions. Standard keeps the current forces. In the harder variant, the US
      tank landing is disrupted and two Soviet air assault battalions attack from Saky on turn five.
    : Choisissez les conditions de l'opération. La version normale conserve les forces actuelles. Dans
      la version difficile, le débarquement des chars américains est compromis et deux bataillons soviétiques
      aéroportés attaquent depuis Saki au cinquième tour.
    ? The 2nd Marine Division HQ and logistics services are available at the beachhead. Review the arriving
      division reserve card.
    : L'état-major de la 2e division de Marines et ses services logistiques sont disponibles à la tête
      de pont. Consultez la carte des réserves divisionnaires qui vient d'arriver.
    ? 'Soviet coastal anti-ship missiles have sunk the tank landing ship carrying the heavy armor. The
      2nd Tank Regiment and detached M1A1 battalion will not land: the Marines must advance with air and
      artillery support. An emergency Soviet helicopter force has already departed Odessa Military District.
      Two battalions will arrive from Saky on turn five and try to cut the Kacha beachhead. Protect your
      northern flank and sea supply line.'
    : 'Les missiles antinavires des batteries côtières soviétiques ont coulé le navire de débarquement
      transportant les blindés lourds. Le 2e régiment de chars et le bataillon détaché de M1A1 ne débarqueront
      pas : les Marines devront avancer avec l''appui de l''aviation et de l''artillerie. Une force héliportée
      soviétique vient de quitter le district militaire d''Odessa. Deux bataillons arriveront depuis Saki
      au cinquième tour pour tenter de couper la tête de pont de Katcha. Protégez votre flanc nord et
      le ravitaillement maritime.'
    ? Intelligence reports that the Americans will land three tank battalions equipped with modern tanks
      within the next twenty-four hours. Strengthen the anti-tank lines and prepare your reserves — the
      enemy intends to break through to Sevastopol.
    : 'Les services de renseignement signalent que les Américains débarqueront trois bataillons équipés
      de chars modernes dans les prochaines vingt-quatre heures. Renforcez les lignes antichars et préparez
      vos réserves : l''ennemi entend percer jusqu''à Sébastopol.'
    ? Two Soviet air assault battalions have reached the Saky sector. Mi-8s have brought infantry and
      supplies, while Mi-24s cover their advance toward Kacha. The enemy intends to cut your forward units
      off from the coast. Secure the approaches to the beachhead immediately.
    : Deux bataillons soviétiques aéroportés ont atteint le secteur de Saki. Les Mi-8 ont amené l'infanterie
      et les approvisionnements, tandis que les Mi-24 couvrent leur avance vers Katcha. L'ennemi veut
      couper vos unités avancées de la côte. Sécurisez immédiatement les accès à la tête de pont.
    Difficulty: Difficulté
    Choose the difficulty level.: Choisissez le niveau de difficulté.
