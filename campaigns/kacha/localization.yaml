    ? 'Date: 7 September 1989

      Duration: 20 turns

      Area: Kacha — Belbek — Sevastopol, Crimea


      With both alliances committed in Central Europe, US command opens a new front on the Black Sea.
      The 2nd Marine Division lands at Kacha to secure its beachhead, break through Belbek and seize Sevastopol.


      The Black Sea Fleet is caught during mobilization. The 810th Naval Infantry Brigade faces the first
      assault while local garrisons buy time. Incomplete regimental groups of the 157th Motor Rifle Division
      assemble at Simferopol and enter the battle in successive waves.


      NATO must capture Sevastopol; the USSR must retake Kacha and break the landing. Taking Simferopol
      blocks Soviet divisional reinforcements. If neither decisive objective is achieved by turn 20, the
      operation ends in failure for the American invasion.


      Losing Kacha does not end the campaign immediately: US forces can retake the beachhead before the
      operation deadline.'
    : 'Date : 7 septembre 1989

      Durée : 20 tours

      Zone : Katcha — Belbek — Sébastopol, Crimée


      Alors que les deux alliances combattent en Europe centrale, le commandement américain ouvre un nouveau
      front sur la mer Noire. La 2e division de Marines débarque à Katcha pour consolider sa tête de pont,
      percer à Belbek et prendre Sébastopol.


      La flotte de la mer Noire est surprise en pleine mobilisation. La 810e brigade d''infanterie de
      marine subit le premier choc, tandis que les garnisons locales gagnent du temps. Les groupements
      incomplets de la 157e division motorisée se rassemblent à Simferopol et entrent successivement dans
      la bataille.


      L''OTAN doit prendre Sébastopol ; l''URSS doit reprendre Katcha et briser le débarquement. La prise
      de Simferopol bloque les renforts divisionnaires soviétiques. Sans objectif décisif atteint au terme
      des vingt tours, l''invasion américaine est un échec.


      Prenez Sébastopol avant le début du tour 20. Le bataillon de sécurité du débarquement reste immobile
      aux tours 1 à 5. La perte de Katcha ne termine pas immédiatement la campagne : reprenez la tête
      de pont avant l’échéance.'
    Landing Security Battalion: Sécurité du débarquement
    ? 'Hold Sevastopol until the operation deadline. Retake Kacha to cut US supply. Capturing the beachhead
      does not immediately end the campaign; US forces can counterattack before the deadline.


      Bakhchysarai guards the road from Simferopol. If the Americans seize Simferopol before turn nine
      begins, the 157th cannot deploy.


      Preserve the regular battalions for a counterattack. District aviation will support you when it
      arrives.'
    : 'Tenez Sébastopol jusqu’à l’échéance de l’opération. Reprenez Katcha pour couper le ravitaillement
      américain. La prise de la tête de pont ne termine pas immédiatement la campagne ; les forces américaines
      peuvent contre-attaquer avant l’échéance.


      Bakhtchissaraï garde la route de Simferopol. Si les Américains prennent Simferopol avant le début
      du neuvième tour, la 157e division ne pourra pas se déployer.


      Préservez les bataillons réguliers pour une contre-attaque. L''aviation du district vous appuiera
      dès son arrivée.'
    ? 'Capture Sevastopol before turn 20 begins. The landing security battalion cannot move during turns
      1–5. Losing Kacha does not end the campaign immediately: retake the beachhead before the deadline.


      Belbek opens the northern approach; Balaklava opens the southern route. Taking Simferopol before
      turn nine begins prevents the Soviet 157th Division from deploying.


      Move quickly while you hold the advantage.'
    : 'Prenez Sébastopol avant le début du tour 20. Le bataillon de sécurité du débarquement reste immobile
      aux tours 1 à 5. La perte de Katcha ne termine pas immédiatement la campagne : reprenez la tête
      de pont avant l’échéance.


      Belbek ouvre l''approche nord ; Balaklava ouvre la route sud. Prendre Simferopol avant le début
      du neuvième tour empêche le déploiement de la 157e division soviétique.


      Avancez vite tant que l''avantage est de votre côté.'
