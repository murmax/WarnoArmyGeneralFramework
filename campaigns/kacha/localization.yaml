    Anti-Tank Flight: Klucz przeciwpancerny
    American Armor Reinforced: Wzmocnienie amerykańskich sił pancernych
    Beachhead Air Defense: Obrona plot. przyczółka
    Defense Conditions: Warunki obrony
    Detached Heavy Tank Bn: Samodz. ciężki bat. czołgów
    HQ and Heavy Armor: Sztab i ciężkie czołgi
    Helicopter Escort: Osłona śmigłowcowa
    Keep Standard: Pozostaw wariant standardowy
    Make It Harder: Utrudnij kampanię
    Marine M1s and Air Defense: M1 piechoty morskiej i OPL
    Mechanized Marine Company: Zmechanizowana kp. marines
    Odessa Air Assault Bn 1: 1. bat. desantowy z Odessy
    Odessa Air Assault Bn 2: 2. bat. desantowy z Odessy
    Odessa Airmobile: Desant z Odessy
    Odessa Airmobile Force: Siły aeromobilne z Odessy
    Odessa Airmobile Group: Grupa desantowa z Odessy
    Operation Conditions: Warunki operacji
    Saky Air Landing: Desant pod Saki
    Soviet Air Landing at Saky: Sowiecki desant pod Saki
    Tank Landing Disrupted: Desant czołgów udaremniony
    Two Air Assault Battalions: Dwa bataliony desantowe
    ? Choose the defense conditions. Standard keeps the current forces. In the harder variant, the US
      2nd Tank Regiment receives M1 Abrams, while its attached force brings heavy M1A1s and a Marine company
      in fifteen Bradleys.
    : Wybierz warunki obrony. Wariant standardowy zachowuje obecne siły. W trudniejszym wariancie 2. amerykański
      pułk czołgów otrzyma M1 Abrams, a przydzielona grupa ciężkie M1A1 i kompanię marines na piętnastu
      Bradleyach.
    ? Choose the operation conditions. Standard keeps the current forces. In the harder variant, the US
      tank landing is disrupted and two Soviet air assault battalions attack from Saky on turn five.
    : Wybierz warunki operacji. Wariant standardowy zachowuje obecne siły. W trudniejszym wariancie amerykański
      desant czołgów zostaje udaremniony, a w piątej turze od strony Saki zaatakują dwa sowieckie bataliony
      desantowe.
    ? The 2nd Marine Division HQ and logistics services are available at the beachhead. Review the arriving
      division reserve card.
    : Sztab 2. Dywizji Piechoty Morskiej i służby zaopatrzenia są dostępne na przyczółku. Sprawdź nową
      kartę rezerwy dywizyjnej.
    ? 'Soviet coastal anti-ship missiles have sunk the tank landing ship carrying the heavy armor. The
      2nd Tank Regiment and detached M1A1 battalion will not land: the Marines must advance with air and
      artillery support. An emergency Soviet helicopter force has already departed Odessa Military District.
      Two battalions will arrive from Saky on turn five and try to cut the Kacha beachhead. Protect your
      northern flank and sea supply line.'
    : 'Sowieckie nadbrzeżne wyrzutnie pocisków przeciwokrętowych zatopiły okręt desantowy przewożący ciężkie
      wozy bojowe. 2. pułk czołgów i przydzielony batalion M1A1 nie wylądują: marines muszą nacierać przy
      wsparciu lotnictwa i artylerii. Z Odeskiego Okręgu Wojskowego wyruszył już pilnie zorganizowany
      desant śmigłowcowy. Dwa bataliony przybędą od strony Saki w piątej turze i spróbują odciąć przyczółek
      pod Kaczą. Osłoń północną flankę i zaopatrzenie drogą morską.'
    ? Intelligence reports that the Americans will land three tank battalions equipped with modern tanks
      within the next twenty-four hours. Strengthen the anti-tank lines and prepare your reserves — the
      enemy intends to break through to Sevastopol.
    : Wywiad donosi, że w ciągu najbliższej doby Amerykanie wysadzą trzy bataliony wyposażone w nowoczesne
      czołgi. Wzmocnij rubieże przeciwpancerne i przygotuj odwody — wróg zamierza przebić się do Sewastopola.
    ? Two Soviet air assault battalions have reached the Saky sector. Mi-8s have brought infantry and
      supplies, while Mi-24s cover their advance toward Kacha. The enemy intends to cut your forward units
      off from the coast. Secure the approaches to the beachhead immediately.
    : Dwa sowieckie bataliony desantowe dotarły w rejon Saki. Mi-8 dostarczyły piechotę i zaopatrzenie,
      a Mi-24 osłaniają natarcie na Kaczę. Wróg chce odciąć twoje wysunięte oddziały od wybrzeża. Natychmiast
      zabezpiecz podejścia do przyczółka.
    Difficulty: Poziom trudności
    Choose the difficulty level.: Wybierz poziom trudności.
    Normal: Normalny
    Harsh: Surowy
    For a first campaign.: Na poznanie kampanii.
    For experienced commanders.: Dla doświadczonych dowódców.
    ? 'Date: 7 September 1989

      Duration: 20 turns

      Area: Kacha — Belbek — Sevastopol, Crimea


      With both alliances committed in Central Europe, US command opens a new front on the Black Sea.
      The 2nd Marine Division lands at Kacha to secure its beachhead, break through Belbek and seize Sevastopol.


      The Black Sea Fleet is caught during mobilization. The 810th Naval Infantry Brigade faces the first
      assault while local garrisons buy time. Incomplete regimental groups of the 157th Motor Rifle Division
      assemble at Simferopol and enter the battle in successive waves.


      NATO must capture Sevastopol; the USSR must retake Kacha and break the landing. Taking Simferopol
