    ? Commander, you now lead the defense of Sevastopol. The Kacha landing has begun, but the main American
      force is still coming ashore.
    : 指挥官，您现在负责保卫塞瓦斯托波尔。卡恰登陆已经开始，但美军主力仍在上岸。
    THE 810TH BRIGADE: 第810旅
    ? Naval infantry protects Belbek, Bakhchysarai and Sevastopol. Facility guards are weaker; use them
      to preserve regular battalions for the decisive fight.
    : 海军陆战队守卫别尔别克、巴赫奇萨赖和塞瓦斯托波尔。设施警卫战力较弱；利用他们节省正规营的力量，准备决战。
    AIRFIELDS HIT: 机场遭袭
    ? The first strike crippled Kacha airfield and destroyed most aircraft on the ground. Surviving helicopters
      joined the 881st Assault Battalion while the airfield guard still fights.
    : 首轮打击瘫痪了卡恰机场，大部分飞机在地面被毁。幸存直升机编入第881突击营，机场警卫仍在战斗。
    157TH MOTOR RIFLE DIVISION: 第157摩步师
    CRIMEAN BEACHHEAD: 克里米亚登陆场
    ? Colonel, the first landing wave has secured a foothold. Soviet outposts still resist, but the sea
      route for follow-on echelons is open.
    : 上校，首批登陆部队已站稳脚跟。苏军前哨仍在抵抗，但后续梯队的海上航线已经打通。
    INVASION FORCE: 入侵部队
    ? Infantry has amphibious vehicles, engineers and air defense. Heavy tanks follow later; open the
      exits from the beach before the Soviet line closes.
    : 步兵配有两栖车辆、工兵和防空力量。重型坦克稍后抵达；务必在苏军封锁前打通海滩出口。
    THE FLEET SUPPORTS THE ADVANCE: 舰队支援进攻
    ? Carrier aircraft control western Crimea for now. Helicopters move reconnaissance and support the
      Marines; Soviet aircraft may return from other airfields.
    : 舰载机暂时控制克里米亚西部。直升机运送侦察兵并支援陆战队；苏军飞机可能从其他机场返回。
    TIME IS AGAINST US: 时间对我军不利
    VICTORY: 胜利
    Sevastopol has fallen. The landing force achieved its main objective; command approves the next phase.: 塞瓦斯托波尔已经陷落。登陆部队达成主要目标，司令部批准进入下一阶段。
    OPERATION STALLED: 行动陷入僵局
    ? Sevastopol was not taken in time. No further American reinforcements will come; approaching Soviet
      reserves force the landing to prepare its defense.
    : 未能及时攻占塞瓦斯托波尔。美军不再获得增援；逼近的苏军预备队迫使登陆部队转入防御。
    OPERATION FAILED: 行动失败
    ? Sevastopol has not fallen. The landing failed to achieve its main objective, and command is terminating
      the operation. Holding the beachhead cannot change the outcome.
    : 塞瓦斯托波尔未被攻陷。登陆行动未达成主要目标，司令部决定终止行动。继续固守登陆场已无法改变结果。
    SEVASTOPOL TAKEN: 塞瓦斯托波尔被占领
    Marines occupy the Black Sea Fleet base. The main objective is complete.: 陆战队占领黑海舰队基地，主要目标已经达成。
    SEVASTOPOL ISOLATED: 塞瓦斯托波尔被孤立
    We hold the Kacha–Balaklava corridor. The city's land routes are cut.: 我军控制卡恰至巴拉克拉瓦走廊，城市陆路已被切断。
    SEVASTOPOL HOLDS: 塞瓦斯托波尔仍在坚守
    Sevastopol has not been taken or completely isolated. An assault would require extending the operation.: 塞瓦斯托波尔既未被攻占，也未遭完全封锁。继续强攻需要延长行动。
    BEACHHEAD LOST: 登陆场失守
    Soviet forces retook Kacha. The ground force can no longer be supplied at scale.: 苏军夺回卡恰，登陆部队已无法获得大规模补给。
    BEACHHEAD HELD: 登陆场仍在手中
    Kacha remains ours. Sea supply continues, but the offensive has lost momentum.: 卡恰仍由我军控制。海上补给继续，但进攻已失去势头。
    CRIMEAN BREAKTHROUGH: 克里米亚突破
    Kacha and Simferopol are ours. Soviet reserve movement is disrupted.: 我军控制卡恰和辛菲罗波尔，苏军预备队的调动受阻。
    ? Sevastopol has held. Soviet forces have denied the American invasion its main objective. The enemy
      no longer has time for a decisive assault.
    : 塞瓦斯托波尔守住了。苏军挫败了美军入侵的主要目标。敌军已无时间发动决定性强攻。
    DEFENSE CONTINUES: 防御仍在继续
    ? Sevastopol holds, but the landing remains in Crimea. Clearing the beachhead will require diverting
      additional reserves from other fronts.
    : 塞瓦斯托波尔仍在坚守，但登陆部队尚留在克里米亚。清除登陆场需要从其他战线调来更多预备队。
    DEFENSE BROKEN: 防线被突破
    Sevastopol is lost. Surviving units withdraw toward Simferopol and prepare a counterattack.: 塞瓦斯托波尔失守。幸存部队向辛菲罗波尔撤退，准备反攻。
    SEVASTOPOL LOST: 塞瓦斯托波尔失守
    US forces occupy the Black Sea Fleet base. Survivors withdraw east.: 美军占领黑海舰队基地，幸存部队向东撤退。
    SEVASTOPOL ENCIRCLED: 塞瓦斯托波尔被包围
    US forces hold the corridor from Kacha to Balaklava. The garrison is cut off.: 美军控制卡恰至巴拉克拉瓦走廊，守军已被切断联系。
    SEVASTOPOL HELD: 塞瓦斯托波尔守住了
    Sevastopol remains Soviet. Encirclement is incomplete; the land routes still need protection.: 塞瓦斯托波尔仍在苏军手中。包围尚未完成，陆路仍需保护。
    BEACHHEAD DESTROYED: 登陆场被摧毁
    Kacha has been retaken. The US sea supply route is broken.: 卡恰已被夺回，美军海上补给线被切断。
    BEACHHEAD REMAINS: 登陆场仍然存在
    US forces still hold Kacha, but their advance has stalled. Reserves move west.: 美军仍控制卡恰，但推进已经停滞。预备队正在向西调动。
    BREAKTHROUGH IN CRIMEA: 克里米亚防线被突破
    US forces hold Kacha and Simferopol. The 157th Division's route is severed.: 美军控制卡恰和辛菲罗波尔，第157师的通路已被切断。
    Second SEAL Detachment: 第二海豹分队
    Choose the second SEAL landing zone. Kacha reinforces the beachhead; Balaklava enables an unsupplied deep raid.: 选择第二海豹分队的投送地点。卡恰可加强登陆场；巴拉克拉瓦可实施无补给纵深突袭。
    Secure the Beach: 稳固海滩
    Land at Kacha beside the supply line.: 在卡恰补给线附近登陆。
    Deep Raid: 纵深突袭
    Land at Balaklava without supply.: 在巴拉克拉瓦登陆，无补给保障。
    Reserve Regiment Ready: 预备团就绪
    Three Black Sea Fleet reserve battalions are available in one Sevastopol reinforcement card.: 黑海舰队三个预备营可通过塞瓦斯托波尔的一张增援卡投入战场。
    '157th: 91st Regiment': 第157师：第91团
    The 91st Motor Rifle Regiment reaches Simferopol. Keep the Bakhchysarai road open.: 第91摩步团经辛菲罗波尔抵达。务必保持巴赫奇萨赖道路畅通。
    Division Reserve: 师预备队
    The 2nd Marine Division HQ and a detached M1A1 battalion reach the beachhead.: 第2海军陆战师师部和配属M1A1坦克营抵达登陆场。
    Air Reinforcements: 航空增援
    ? Odessa Military District is sending another air group to Crimea. Request MiG-27s to strike armor
      or Su-25s to support the troops.
    : 敖德萨军区向克里米亚派遣另一支航空群。可选择米格-27打击装甲目标，或苏-25支援地面部队。
    MiG-27: 米格-27
    Four MiG-27s will strike armor and defensive positions.: 四架米格-27将打击装甲车辆和防御阵地。
    Su-25: 苏-25
    Su-25s will support naval infantry and counterattacks near Sevastopol.: 苏-25将支援海军陆战队及塞瓦斯托波尔附近的反攻。
    Carrier Withdraws: 航母撤离
    Carrier Damaged: 航母受损
    Frontline Wings Redeployed: 前线航空群调入
    Soviet Air Reinforcements: 苏军航空增援
    The USSR continues deploying aviation in the sector. Intelligence reports new Su-24 and MiG-23 groups at the rear airbase.: 苏联继续在本区域部署航空力量。情报发现后方机场新到达的苏-24和米格-23机群。
    Deployment Prevented: 部署被阻止
    ? Simferopol was seized before the 157th could deploy. You intercepted its unloading and supply hub
      in time; the division will not reach Sevastopol.
    : 在第157师展开前攻占了辛菲罗波尔。您及时截断其卸载补给枢纽，该师无法赶到塞瓦斯托波尔。
    157th Division Deploys: 第157师开始展开
    ? Simferopol was not captured in time. Soviet regimental groups have begun deploying; expect stronger
      defenses and counterattacks along the Bakhchysarai road.
    : 未能及时攻占辛菲罗波尔。苏军团级集群开始展开；巴赫奇萨赖公路将出现更强的防御与反攻。
    ? 'Date: 7 September 1989

      Duration: 20 turns

      Area: Kacha — Belbek — Sevastopol, Crimea


      With both alliances committed in Central Europe, US command opens a new front on the Black Sea.
      The 2nd Marine Division lands at Kacha to secure its beachhead, break through Belbek and seize Sevastopol.


      The Black Sea Fleet is caught during mobilization. The 810th Naval Infantry Brigade faces the first
      assault while local garrisons buy time. Incomplete regimental groups of the 157th Motor Rifle Division
      assemble at Simferopol and enter the battle in successive waves.


      NATO must capture Sevastopol; the USSR must retake Kacha and break the landing. Taking Simferopol
      blocks Soviet divisional reinforcements. If neither decisive objective is achieved by turn 20, the
      operation ends in failure for the American invasion.'
    : '日期：1989年9月7日

      时限：20回合

      区域：卡恰—别尔别克—塞瓦斯托波尔，克里米亚


      双方联盟主力正投入中欧战场，美军司令部在黑海开辟新战线。第2海军陆战师在卡恰登陆，旨在稳固登陆场、突破别尔别克并攻占塞瓦斯托波尔。


      黑海舰队在动员过程中遭到突袭。第810海军陆战旅迎接第一波进攻，地方驻军争取时间。第157摩步师尚未齐装的团级集群在辛菲罗波尔集结，分批投入战斗。


      北约必须攻占塞瓦斯托波尔；苏联必须夺回卡恰，击败登陆部队。占领辛菲罗波尔将阻止苏军师级增援。若到第20回合仍未达成决定性目标，美军入侵将宣告失败。'
    ? 'Principal forces:


      #US 2nd Marine Division

      #US 6th and 8th Marines

      #US 2nd Tank Battalion and attached M1A1s

      #US 10th Marines artillery

      #US Navy SEAL and helicopter groups


      #US Carrier aviation and I-HAWK'
    : '主要部队：


      #US 第2海军陆战师

      #US 海军陆战第6团和第8团

      #US 第2坦克营及配属M1A1

      #US 第10团炮兵

      #US 海豹突击队和直升机群


      #US 舰载航空兵与I-HAWK防空系统'
    ? 'Principal forces:


      #SOV 810th Naval Infantry Brigade

      #SOV 157th Motor Rifle Division

      #SOV 60th Air Defence Corps

      #SOV Black Sea Fleet garrisons and reserves

      #SOV Kacha territorial defence


      #SOV Soviet aviation'
    : '主要部队：


      #SOV 第810海军陆战旅

      #SOV 第157摩步师

      #SOV 第60防空军

      #SOV 黑海舰队驻军与预备队

      #SOV 卡恰地方防卫部队


      #SOV 苏军航空兵'
    ? 'Hold Sevastopol until the operation ends. Retaking Kacha immediately defeats the landing.


      Bakhchysarai guards the road from Simferopol. If the Americans seize Simferopol before turn nine
      begins, the 157th cannot deploy.


      Preserve the regular battalions for a counterattack. District aviation will support you when it
      arrives.'
    : '守住塞瓦斯托波尔，直到行动结束。夺回卡恰即可立即击败登陆部队。


      巴赫奇萨赖守卫来自辛菲罗波尔的道路。如果美军在第9回合开始前占领辛菲罗波尔，第157师将无法展开。


      保存正规营的力量，准备反攻。军区航空兵抵达后将提供支援。'
    ? 'Capture Sevastopol before the twenty-turn operation ends. Hold Kacha: losing the beachhead immediately
      defeats the landing.


      Belbek opens the northern approach; Balaklava opens the southern route. Taking Simferopol before
      turn nine begins prevents the Soviet 157th Division from deploying.


      Move quickly while you hold the advantage.'
    : '在20回合行动时限结束前攻占塞瓦斯托波尔。守住卡恰：失去登陆场将立即导致行动失败。


      别尔别克通向北部入口，巴拉克拉瓦打开南部道路。在第9回合开始前攻占辛菲罗波尔，可以阻止苏军第157师展开。


      趁优势仍在我军手中，迅速行动。'
    ? Soviet submarines have damaged the carrier. It is withdrawing for repairs; F-14 and SEAD operations
      are suspended. The amphibious ships remain, and Harriers will continue supporting you. The entire
      operation is at risk. You have twenty hours — five turns — to take Sevastopol. Otherwise the landing
      will be declared a failure.
    : 苏军潜艇击伤了航母。该舰撤离维修，F-14与防空压制航空群停止作战。两栖舰仍留在战区，鹞式战机将继续支援。整个行动面临失败。您只有20小时——5个回合——攻占塞瓦斯托波尔，否则登陆行动将宣告失败。
    ? 'Our submarines have damaged the American carrier and forced it to withdraw. F-14s and the SEAD
      group leave the sector; Harriers remain aboard the amphibious ships. The enemy operation is in jeopardy:
      they have twenty hours — five turns — to capture Sevastopol. Hold the city and defeat the invasion.'
    : 我军潜艇击伤美军航母，迫使其撤退。F-14和防空压制航空群离开战区，鹞式战机留在两栖舰上。敌方行动陷入危机：他们只有20小时——5个回合——夺取塞瓦斯托波尔。守住城市，挫败入侵。
    ? Su-24 and MiG-23 wings have arrived directly from the front to defend Sevastopol. Both are at half
      strength and badly disorganized. Fuel and ammunition deliveries are only beginning, and the pilots
      are exhausted. Allow them at least a few hours of rest.
    : 苏-24和米格-23机群直接从前线调来保卫塞瓦斯托波尔。两支机群都只剩一半兵力，且严重混乱。燃油和弹药供应才刚刚开始，飞行员已精疲力竭。请至少让他们休息几个小时。
    ? 'Commander, you have been assigned to lead the defense of Sevastopol.


      Only twelve hours ago, High Command confirmed that the Americans were preparing a major landing
      operation in Crimea.


      We were too late.


      Forward US Marine Corps units have already landed at Kacha and secured a foothold. Fighting to expand
      the beachhead continues.'
    : '指挥官，您受命指挥塞瓦斯托波尔的防御。


      就在12小时前，最高统帅部才确认美军正在准备大规模克里米亚登陆行动。


      我们来迟了。


      美海军陆战队先头部队已在卡恰上岸并站稳脚跟。扩大登陆场的战斗仍在继续。'
    ? 'The backbone of the defense remains the Black Sea Fleet’s 810th Independent Naval Infantry Brigade.


      Its units are dispersed between Kacha, Belbek, Sevastopol and Bakhchysarai.


      Composite fleet garrisons, border guards and rear-area personnel also come under your command.


      Soviet aircraft will be redeployed to Crimea, but air support is scarce for now.'
    : '防御主力仍是黑海舰队第810独立海军陆战旅。


      其部队分散在卡恰、别尔别克、塞瓦斯托波尔和巴赫奇萨赖之间。


      舰队混编驻军、边防军和后勤人员也归您指挥。


      苏军飞机将调往克里米亚，但目前空中支援十分有限。'
    ? 'The first American strike targeted Black Sea Fleet aviation.


      Kacha airfield has been devastated. Most aircraft and helicopters were destroyed on the ground.


      Surviving Mi-8s and Ka-29s have been assigned to the 881st Independent Assault Battalion.


      Airfield guards and surviving technical personnel form a separate defensive group.'
    : '美军首轮打击针对黑海舰队航空兵。


      卡恰机场遭到重创，大部分飞机和直升机在地面被毁。


      幸存的米-8和卡-29编入第881独立突击营。


      机场警卫与幸存技术人员组成独立防御分队。'
    ? 'Colonel, the first phase of the operation is complete.


      Marines have landed at Kacha and secured a beachhead.


      Soviet aviation at nearby airfields has been largely destroyed, while the main Black Sea Fleet force
      has been diverted toward Romania.


      The principal phase now begins: the advance on Sevastopol.'
    : '上校，行动第一阶段已完成。


      陆战队在卡恰登陆并稳固了登陆场。


      附近机场的苏军航空兵大部被摧毁，黑海舰队主力则被调开至罗马尼亚方向。


      现在进入主要阶段：向塞瓦斯托波尔推进。'
    ? 'The landing force is built around units of II Marine Expeditionary Force.


      The 6th and 8th Marine Regiments form the first line.


      Armor, artillery and units of the 2nd Tank Battalion support them.


      An additional M1A1 tank group has been attached to break the Soviet defense.'
    : '登陆部队以美国第二海军陆战远征军所属部队为核心。


      海军陆战第6团和第8团组成第一线。


      装甲、炮兵和第2坦克营的部队为其提供支援。


      另有配属M1A1坦克群，负责突破苏军防线。'
    ? 'Carrier aircraft continue operations over western Crimea.


      Marine helicopters provide troop transport, supply and close support.


      Soviet air activity is currently negligible.


      This advantage is temporary: the enemy is already redeploying aircraft from other sectors.'
    : '舰载航空兵继续在克里米亚西部作战。


      陆战队直升机负责兵力运输、补给和近距支援。


      苏军当前空中活动极少。


      这一优势只是暂时的：敌军已经开始从其他战区调来飞机。'
    UNITED STATES — Attack: 美国——进攻
    SOVIET UNION — Defense: 苏联——防御
