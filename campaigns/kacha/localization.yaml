    'Kacha: Defense of Sevastopol': 'Katcha : défense de Sébastopol'
    'NATO: take Sevastopol. USSR: retake Kacha.': 'OTAN : prendre Sébastopol. URSS : reprendre Katcha.'
    '#US #SOV #medium{BLACK SEA — SEPTEMBER 1989} Kacha: Defense of Sevastopol': '#US #SOV #medium{MER
      NOIRE — SEPTEMBRE 1989} Katcha : défense de Sébastopol'
    Amphibious landing against the Black Sea Fleet base: Débarquement contre la base de la flotte de la
      mer Noire
    DEFENSE OF SEVASTOPOL: DÉFENSE DE SÉBASTOPOL
    ? Commander, you now lead the defense of Sevastopol. The Kacha landing has begun, but the main American
      force is still coming ashore.
    : Commandant, vous dirigez désormais la défense de Sébastopol. Le débarquement à Katcha a commencé,
      mais le gros des forces américaines est encore en train de prendre pied.
    THE 810TH BRIGADE: LA 810e BRIGADE
    ? Naval infantry protects Belbek, Bakhchysarai and Sevastopol. Facility guards are weaker; use them
      to preserve regular battalions for the decisive fight.
    : L'infanterie de marine défend Belbek, Bakhtchissaraï et Sébastopol. Les gardes des installations
      sont moins aguerris ; employez-les pour préserver les bataillons réguliers en vue du combat décisif.
    AIRFIELDS HIT: AÉRODROMES FRAPPÉS
    ? The first strike crippled Kacha airfield and destroyed most aircraft on the ground. Surviving helicopters
      joined the 881st Assault Battalion while the airfield guard still fights.
    : La première frappe a paralysé l'aérodrome de Katcha et détruit la plupart des appareils au sol.
      Les hélicoptères survivants ont rejoint le 881e bataillon d'assaut, tandis que la garde de l'aérodrome
      continue le combat.
    157TH MOTOR RIFLE DIVISION: 157e DIVISION MOTORISÉE
    CRIMEAN BEACHHEAD: TÊTE DE PONT EN CRIMÉE
    ? Colonel, the first landing wave has secured a foothold. Soviet outposts still resist, but the sea
      route for follow-on echelons is open.
    : Colonel, la première vague a établi une tête de pont. Les avant-postes soviétiques résistent encore,
      mais la voie maritime est ouverte aux échelons suivants.
    INVASION FORCE: FORCE D'INVASION
    ? Infantry has amphibious vehicles, engineers and air defense. Heavy tanks follow later; open the
      exits from the beach before the Soviet line closes.
    : L'infanterie dispose de véhicules amphibies, de sapeurs et de moyens antiaériens. Les chars lourds
      suivront ; ouvrez les sorties de plage avant que les Soviétiques ne referment leur ligne.
    THE FLEET SUPPORTS THE ADVANCE: LA FLOTTE APPUIE L'AVANCÉE
    ? Carrier aircraft control western Crimea for now. Helicopters move reconnaissance and support the
      Marines; Soviet aircraft may return from other airfields.
    : L'aviation embarquée domine pour l'instant l'ouest de la Crimée. Les hélicoptères transportent les
      éclaireurs et soutiennent les Marines ; des avions soviétiques peuvent revenir depuis d'autres bases.
    TIME IS AGAINST US: LE TEMPS JOUE CONTRE NOUS
    VICTORY: VICTOIRE
    Sevastopol has fallen. The landing force achieved its main objective; command approves the next phase.: Sébastopol
      est tombée. Le corps de débarquement a atteint son objectif principal ; le commandement autorise
      la phase suivante.
    OPERATION STALLED: OPÉRATION ENLISÉE
    ? Sevastopol was not taken in time. No further American reinforcements will come; approaching Soviet
      reserves force the landing to prepare its defense.
    : Sébastopol n'a pas été prise à temps. Aucun renfort américain supplémentaire ne viendra ; les réserves
      soviétiques en approche obligent le débarquement à préparer sa défense.
    OPERATION FAILED: OPÉRATION ÉCHOUÉE
    ? Sevastopol has not fallen. The landing failed to achieve its main objective, and command is terminating
      the operation. Holding the beachhead cannot change the outcome.
    : Sébastopol n'est pas tombée. Le débarquement n'a pas atteint son objectif principal et le commandement
      met fin à l'opération. Tenir la tête de pont ne peut plus en changer l'issue.
    SEVASTOPOL TAKEN: SÉBASTOPOL PRISE
    Marines occupy the Black Sea Fleet base. The main objective is complete.: Les Marines occupent la
      base de la flotte de la mer Noire. L'objectif principal est atteint.
    SEVASTOPOL ISOLATED: SÉBASTOPOL ISOLÉE
    We hold the Kacha–Balaklava corridor. The city's land routes are cut.: Nous tenons le corridor Katcha–Balaklava.
      Les voies terrestres de la ville sont coupées.
    SEVASTOPOL HOLDS: SÉBASTOPOL RÉSISTE
    Sevastopol has not been taken or completely isolated. An assault would require extending the operation.: Sébastopol
      n'a été ni prise ni complètement isolée. Un assaut exigerait de prolonger l'opération.
    BEACHHEAD LOST: TÊTE DE PONT PERDUE
    Soviet forces retook Kacha. The ground force can no longer be supplied at scale.: Les Soviétiques
      ont repris Katcha. Le ravitaillement massif des forces terrestres n'est plus possible.
    BEACHHEAD HELD: TÊTE DE PONT TENUE
    Kacha remains ours. Sea supply continues, but the offensive has lost momentum.: Katcha reste entre
      nos mains. Le ravitaillement maritime continue, mais l'offensive a perdu son élan.
    CRIMEAN BREAKTHROUGH: PERCÉE EN CRIMÉE
    Kacha and Simferopol are ours. Soviet reserve movement is disrupted.: Katcha et Simferopol sont à
      nous. Le mouvement des réserves soviétiques est désorganisé.
    ? Sevastopol has held. Soviet forces have denied the American invasion its main objective. The enemy
      no longer has time for a decisive assault.
    : Sébastopol a tenu. Les forces soviétiques ont fait échouer l'objectif principal de l'invasion américaine.
      L'ennemi n'a plus le temps de lancer un assaut décisif.
    DEFENSE CONTINUES: LA DÉFENSE CONTINUE
    ? Sevastopol holds, but the landing remains in Crimea. Clearing the beachhead will require diverting
      additional reserves from other fronts.
    : Sébastopol tient, mais le débarquement reste en Crimée. Réduire la tête de pont exigera de détourner
      d'autres réserves des autres fronts.
    DEFENSE BROKEN: DÉFENSE BRISÉE
    Sevastopol is lost. Surviving units withdraw toward Simferopol and prepare a counterattack.: Sébastopol
      est perdue. Les unités survivantes se replient vers Simferopol et préparent une contre-attaque.
    SEVASTOPOL LOST: SÉBASTOPOL PERDUE
    US forces occupy the Black Sea Fleet base. Survivors withdraw east.: Les Américains occupent la base
      de la flotte de la mer Noire. Les survivants se replient vers l'est.
    SEVASTOPOL ENCIRCLED: SÉBASTOPOL ENCERCLÉE
    US forces hold the corridor from Kacha to Balaklava. The garrison is cut off.: Les Américains tiennent
      le corridor de Katcha à Balaklava. La garnison est coupée du reste des forces.
    SEVASTOPOL HELD: SÉBASTOPOL TENUE
    Sevastopol remains Soviet. Encirclement is incomplete; the land routes still need protection.: Sébastopol
      reste soviétique. L'encerclement est incomplet ; les voies terrestres doivent encore être protégées.
    BEACHHEAD DESTROYED: TÊTE DE PONT DÉTRUITE
    Kacha has been retaken. The US sea supply route is broken.: Katcha a été reprise. La voie de ravitaillement
      maritime américaine est coupée.
    BEACHHEAD REMAINS: LA TÊTE DE PONT SUBSISTE
    US forces still hold Kacha, but their advance has stalled. Reserves move west.: Les Américains tiennent
      encore Katcha, mais leur avancée est stoppée. Les réserves se déplacent vers l'ouest.
    BREAKTHROUGH IN CRIMEA: RUPTURE EN CRIMÉE
    US forces hold Kacha and Simferopol. The 157th Division's route is severed.: Les Américains tiennent
      Katcha et Simferopol. La route de la 157e division est coupée.
    Second SEAL Detachment: Deuxième détachement SEAL
    Choose the second SEAL landing zone. Kacha reinforces the beachhead; Balaklava enables an unsupplied deep raid.: Choisissez
      la zone d'insertion du second détachement SEAL. Katcha renforce la tête de pont ; Balaklava permet
      un raid en profondeur sans ravitaillement.
    Secure the Beach: Sécuriser la plage
    Land at Kacha beside the supply line.: Débarquez à Katcha près de la ligne de ravitaillement.
    Deep Raid: Raid en profondeur
    Land at Balaklava without supply.: Débarquez à Balaklava sans ravitaillement.
    Reserve Regiment Ready: Régiment de réserve prêt
    Three Black Sea Fleet reserve battalions are available in one Sevastopol reinforcement card.: Trois
      bataillons de réserve de la flotte de la mer Noire sont disponibles dans une seule carte de renfort
      à Sébastopol.
    '157th: 91st Regiment': '157e division : 91e régiment'
    The 91st Motor Rifle Regiment reaches Simferopol. Keep the Bakhchysarai road open.: Le 91e régiment
      motorisé arrive par Simferopol. Gardez ouverte la route de Bakhtchissaraï.
    Division Reserve: Réserve divisionnaire
    The 2nd Marine Division HQ and a detached M1A1 battalion reach the beachhead.: L'état-major de la
      2e division de Marines et un bataillon de M1A1 attaché rejoignent la tête de pont.
    Air Reinforcements: Renforts aériens
    ? Odessa Military District is sending another air group to Crimea. Request MiG-27s to strike armor
      or Su-25s to support the troops.
    : Le district militaire d'Odessa envoie un nouveau groupe aérien en Crimée. Demandez des MiG-27 contre
      les blindés ou des Su-25 pour appuyer les troupes.
    MiG-27: MiG-27
    Four MiG-27s will strike armor and defensive positions.: Quatre MiG-27 frapperont les blindés et les
      positions défensives.
    Su-25: Su-25
    Su-25s will support naval infantry and counterattacks near Sevastopol.: Les Su-25 appuieront l'infanterie
      de marine et les contre-attaques près de Sébastopol.
    Carrier Withdraws: Le porte-avions se retire
    Carrier Damaged: Porte-avions endommagé
    Frontline Wings Redeployed: Groupes du front redéployés
    Soviet Air Reinforcements: Renforts aériens soviétiques
    The USSR continues deploying aviation in the sector. Intelligence reports new Su-24 and MiG-23 groups at the rear airbase.: L'URSS
      poursuit le déploiement de son aviation dans le secteur. Le renseignement signale de nouveaux groupes
      de Su-24 et MiG-23 sur l'aérodrome arrière.
    Deployment Prevented: Déploiement empêché
    ? Simferopol was seized before the 157th could deploy. You intercepted its unloading and supply hub
      in time; the division will not reach Sevastopol.
    : Simferopol a été prise avant le déploiement de la 157e division. Vous avez intercepté à temps son
      centre de débarquement et de ravitaillement ; elle n'atteindra pas Sébastopol.
    157th Division Deploys: La 157e division se déploie
    ? Simferopol was not captured in time. Soviet regimental groups have begun deploying; expect stronger
      defenses and counterattacks along the Bakhchysarai road.
    : Simferopol n'a pas été prise à temps. Les groupements régimentaires soviétiques commencent leur
      déploiement ; attendez-vous à une défense renforcée et à des contre-attaques sur la route de Bakhtchissaraï.
    ? 'Date: 7 September 1989

      Duration: 20 turns

      Area: Kacha — Belbek — Sevastopol, Crimea


      With both alliances committed in Central Europe, US command opens a new front on the Black Sea.
      The 2nd Marine Division lands at Kacha to secure its beachhead, break through Belbek and seize Sevastopol.


      The Black Sea Fleet is caught during mobilization. The 810th Naval Infantry Brigade faces the first
      assault while local garrisons buy time. Incomplete regimental groups of the 157th Motor Rifle Division
      assemble at Simferopol and enter the battle in successive waves.


      NATO must capture Sevastopol; the USSR must retake Kacha and break the landing. Taking Simferopol
      blocks Soviet divisional reinforcements. If neither decisive objective is achieved by turn 20, the
      operation ends in failure for the American invasion.'
    : 'Date : 7 septembre 1989

      Durée : 20 tours

      Zone : Katcha — Belbek — Sébastopol, Crimée


      Alors que les deux alliances combattent en Europe centrale, le commandement américain ouvre un nouveau
      front sur la mer Noire. La 2e division de Marines débarque à Katcha pour consolider sa tête de pont,
      percer à Belbek et prendre Sébastopol.


      La flotte de la mer Noire est surprise en pleine mobilisation. La 810e brigade d''infanterie de
      marine subit le premier choc, tandis que les garnisons locales gagnent du temps. Les groupements
      incomplets de la 157e division motorisée se rassemblent à Simferopol et entrent successivement dans
      la bataille.


      L''OTAN doit prendre Sébastopol ; l''URSS doit reprendre Katcha et briser le débarquement. La prise
      de Simferopol bloque les renforts divisionnaires soviétiques. Sans objectif décisif atteint au terme
      des vingt tours, l''invasion américaine est un échec.'
    ? 'Principal forces:


      #US 2nd Marine Division

      #US 6th and 8th Marines

      #US 2nd Tank Battalion and attached M1A1s

      #US 10th Marines artillery

      #US Navy SEAL and helicopter groups


      #US Carrier aviation and I-HAWK'
    : 'Forces principales :


      #US 2e division de Marines

      #US 6e et 8e régiments de Marines

      #US 2e bataillon de chars et M1A1 attachés

      #US Artillerie du 10e régiment

      #US Navy SEAL et groupes d''hélicoptères


      #US Aviation embarquée et I-HAWK'
    ? 'Principal forces:


      #SOV 810th Naval Infantry Brigade

      #SOV 157th Motor Rifle Division

      #SOV 60th Air Defence Corps

      #SOV Black Sea Fleet garrisons and reserves

      #SOV Kacha territorial defence


      #SOV Soviet aviation'
    : 'Forces principales :


      #SOV 810e brigade d''infanterie de marine

      #SOV 157e division motorisée

      #SOV 60e corps de défense aérienne

      #SOV Garnisons et réserves de la flotte de la mer Noire

      #SOV Défense territoriale de Katcha


      #SOV Aviation soviétique'
    ? 'Hold Sevastopol until the operation ends. Retaking Kacha immediately defeats the landing.


      Bakhchysarai guards the road from Simferopol. If the Americans seize Simferopol before turn nine
      begins, the 157th cannot deploy.


      Preserve the regular battalions for a counterattack. District aviation will support you when it
      arrives.'
    : 'Tenez Sébastopol jusqu''à la fin de l''opération. Reprendre Katcha brise immédiatement le débarquement.


      Bakhtchissaraï garde la route de Simferopol. Si les Américains prennent Simferopol avant le début
      du neuvième tour, la 157e division ne pourra pas se déployer.


      Préservez les bataillons réguliers pour une contre-attaque. L''aviation du district vous appuiera
      dès son arrivée.'
    ? 'Capture Sevastopol before the twenty-turn operation ends. Hold Kacha: losing the beachhead immediately
      defeats the landing.


      Belbek opens the northern approach; Balaklava opens the southern route. Taking Simferopol before
      turn nine begins prevents the Soviet 157th Division from deploying.


      Move quickly while you hold the advantage.'
    : 'Prenez Sébastopol avant la fin de l''opération de vingt tours. Tenez Katcha : perdre la tête de
      pont fait immédiatement échouer le débarquement.


      Belbek ouvre l''approche nord ; Balaklava ouvre la route sud. Prendre Simferopol avant le début
      du neuvième tour empêche le déploiement de la 157e division soviétique.


      Avancez vite tant que l''avantage est de votre côté.'
    ? Soviet submarines have damaged the carrier. It is withdrawing for repairs; F-14 and SEAD operations
      are suspended. The amphibious ships remain, and Harriers will continue supporting you. The entire
      operation is at risk. You have twenty hours — five turns — to take Sevastopol. Otherwise the landing
      will be declared a failure.
    : Des sous-marins soviétiques ont endommagé le porte-avions. Il se retire pour réparations ; les opérations
      des F-14 et du groupe SEAD cessent. Les bâtiments amphibies restent, et les Harrier continueront
      leur appui. Toute l'opération est menacée. Vous avez vingt heures — cinq tours — pour prendre Sébastopol.
      Sinon, le débarquement sera déclaré un échec.
    ? 'Our submarines have damaged the American carrier and forced it to withdraw. F-14s and the SEAD
      group leave the sector; Harriers remain aboard the amphibious ships. The enemy operation is in jeopardy:
      they have twenty hours — five turns — to capture Sevastopol. Hold the city and defeat the invasion.'
    : 'Nos sous-marins ont endommagé le porte-avions américain et l''ont forcé à se retirer. Les F-14
      et le groupe SEAD quittent le secteur ; les Harrier restent à bord des bâtiments amphibies. L''opération
      ennemie est compromise : il leur reste vingt heures — cinq tours — pour prendre Sébastopol. Tenez
      la ville et faites échouer l''invasion.'
    ? Su-24 and MiG-23 wings have arrived directly from the front to defend Sevastopol. Both are at half
      strength and badly disorganized. Fuel and ammunition deliveries are only beginning, and the pilots
      are exhausted. Allow them at least a few hours of rest.
    : Des groupes de Su-24 et MiG-23 arrivent directement du front pour défendre Sébastopol. Ils ont perdu
      la moitié de leurs appareils et sont désorganisés. Les livraisons de carburant et de munitions commencent
      à peine, les pilotes sont épuisés. Accordez-leur au moins quelques heures de repos.
    ? 'Commander, you have been assigned to lead the defense of Sevastopol.


      Only twelve hours ago, High Command confirmed that the Americans were preparing a major landing
      operation in Crimea.


      We were too late.


      Forward US Marine Corps units have already landed at Kacha and secured a foothold. Fighting to expand
      the beachhead continues.'
    : 'Commandant, vous avez été chargé de diriger la défense de Sébastopol.


      Il y a seulement douze heures, le haut commandement a confirmé que les Américains préparaient un
      débarquement majeur en Crimée.


      Nous sommes arrivés trop tard.


      Les éléments avancés du Corps des Marines ont déjà débarqué à Katcha et pris pied sur la côte. Les
      combats pour élargir la tête de pont se poursuivent.'
    ? 'The backbone of the defense remains the Black Sea Fleet’s 810th Independent Naval Infantry Brigade.


      Its units are dispersed between Kacha, Belbek, Sevastopol and Bakhchysarai.


      Composite fleet garrisons, border guards and rear-area personnel also come under your command.


      Soviet aircraft will be redeployed to Crimea, but air support is scarce for now.'
    : 'La défense repose sur la 810e brigade indépendante d''infanterie de marine de la flotte de la mer
      Noire.


      Ses unités sont dispersées entre Katcha, Belbek, Sébastopol et Bakhtchissaraï.


      Des garnisons composites de la flotte, des gardes-frontières et du personnel des arrières passent
      également sous votre commandement.


      L''aviation soviétique sera redéployée en Crimée, mais l''appui aérien est encore rare.'
    ? 'The first American strike targeted Black Sea Fleet aviation.


      Kacha airfield has been devastated. Most aircraft and helicopters were destroyed on the ground.


      Surviving Mi-8s and Ka-29s have been assigned to the 881st Independent Assault Battalion.


      Airfield guards and surviving technical personnel form a separate defensive group.'
    : 'La première frappe américaine visait l''aviation de la flotte de la mer Noire.


      L''aérodrome de Katcha a été dévasté. La plupart des avions et hélicoptères ont été détruits au
      sol.


      Les Mi-8 et Ka-29 survivants ont été affectés au 881e bataillon indépendant d''assaut.


      Les gardes de l''aérodrome et les techniciens survivants forment un groupe défensif distinct.'
    ? 'Colonel, the first phase of the operation is complete.


      Marines have landed at Kacha and secured a beachhead.


      Soviet aviation at nearby airfields has been largely destroyed, while the main Black Sea Fleet force
      has been diverted toward Romania.


      The principal phase now begins: the advance on Sevastopol.'
    : 'Colonel, la première phase de l''opération est achevée.


      Les Marines ont débarqué à Katcha et établi une tête de pont.


      L''aviation soviétique des aérodromes proches a été largement détruite, tandis que le gros de la
      flotte de la mer Noire a été détourné vers la Roumanie.


      La phase principale commence : l''avancée sur Sébastopol.'
    ? 'The landing force is built around units of II Marine Expeditionary Force.


      The 6th and 8th Marine Regiments form the first line.


      Armor, artillery and units of the 2nd Tank Battalion support them.


      An additional M1A1 tank group has been attached to break the Soviet defense.'
    : 'Le corps de débarquement s''articule autour du IIe corps expéditionnaire des Marines.


      Les 6e et 8e régiments de Marines forment le premier échelon.


      Les blindés, l''artillerie et les éléments du 2e bataillon de chars les appuient.


      Un groupe de M1A1 supplémentaire a été attaché pour percer la défense soviétique.'
    ? 'Carrier aircraft continue operations over western Crimea.


      Marine helicopters provide troop transport, supply and close support.


      Soviet air activity is currently negligible.


      This advantage is temporary: the enemy is already redeploying aircraft from other sectors.'
    : 'L''aviation embarquée poursuit ses opérations sur l''ouest de la Crimée.


      Les hélicoptères des Marines assurent transport, ravitaillement et appui rapproché.


      L''activité aérienne soviétique est actuellement négligeable.


      Cet avantage est temporaire : l''ennemi redéploie déjà des appareils depuis d''autres secteurs.'
    UNITED STATES — Attack: ÉTATS-UNIS — Attaque
    SOVIET UNION — Defense: UNION SOVIÉTIQUE — Défense
