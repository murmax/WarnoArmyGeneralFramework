    ? Choose the defense conditions. Standard keeps the current forces. In the harder variant, the US
      2nd Tank Regiment receives M1 Abrams, while its attached force brings heavy M1A1s and a Marine company
      in fifteen Bradleys.
    : Elija las condiciones de defensa. La versión normal mantiene las fuerzas actuales. En la variante
      difícil, el 2.º regimiento blindado estadounidense recibe M1 Abrams, mientras su fuerza agregada
      trae M1A1 pesados y una compañía de Marines en quince Bradley.
    ? Choose the operation conditions. Standard keeps the current forces. In the harder variant, the US
      tank landing is disrupted and two Soviet air assault battalions attack from Saky on turn five.
    : Elija las condiciones de la operación. La versión normal mantiene las fuerzas actuales. En la variante
      difícil, se frustra el desembarco blindado estadounidense y dos batallones soviéticos de asalto
      aéreo atacan desde Saki en el quinto turno.
    ? The 2nd Marine Division HQ and logistics services are available at the beachhead. Review the arriving
      division reserve card.
    : El cuartel general de la 2.ª División de Marines y los servicios logísticos están disponibles en
      la cabeza de playa. Revise la tarjeta de reserva divisionaria que acaba de llegar.
    ? 'Soviet coastal anti-ship missiles have sunk the tank landing ship carrying the heavy armor. The
      2nd Tank Regiment and detached M1A1 battalion will not land: the Marines must advance with air and
      artillery support. An emergency Soviet helicopter force has already departed Odessa Military District.
      Two battalions will arrive from Saky on turn five and try to cut the Kacha beachhead. Protect your
      northern flank and sea supply line.'
    : 'Los misiles antibuque de las baterías costeras soviéticas han hundido el buque de desembarco que
      transportaba los blindados pesados. El 2.º regimiento blindado y el batallón agregado de M1A1 no
      desembarcarán: los Marines deben avanzar con apoyo aéreo y de artillería. Una fuerza soviética de
      helicópteros ya ha salido del distrito militar de Odesa. Dos batallones llegarán desde Saki en el
      quinto turno e intentarán cortar la cabeza de playa de Kacha. Proteja el flanco norte y el abastecimiento
      marítimo.'
    ? Intelligence reports that the Americans will land three tank battalions equipped with modern tanks
      within the next twenty-four hours. Strengthen the anti-tank lines and prepare your reserves — the
      enemy intends to break through to Sevastopol.
    : 'La inteligencia informa de que los estadounidenses desembarcarán tres batallones equipados con
      carros de combate modernos en las próximas veinticuatro horas. Refuerce las líneas contracarro y
      prepare sus reservas: el enemigo pretende abrirse paso hasta Sebastopol.'
    ? Two Soviet air assault battalions have reached the Saky sector. Mi-8s have brought infantry and
      supplies, while Mi-24s cover their advance toward Kacha. The enemy intends to cut your forward units
      off from the coast. Secure the approaches to the beachhead immediately.
    : Dos batallones soviéticos de asalto aéreo han llegado al sector de Saki. Los Mi-8 han traído infantería
      y suministros, mientras los Mi-24 cubren el avance hacia Kacha. El enemigo pretende aislar sus unidades
      avanzadas de la costa. Asegure inmediatamente los accesos a la cabeza de playa.
