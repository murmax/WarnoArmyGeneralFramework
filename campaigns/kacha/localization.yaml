    : 'Data: 7 września 1989

      Czas: 20 tur

      Obszar: Kacza — Belbek — Sewastopol, Krym


      Gdy oba sojusze są zaangażowane w Europie Środkowej, amerykańskie dowództwo otwiera nowy front nad
      Morzem Czarnym. 2. Dywizja Piechoty Morskiej ląduje w Kaczy, by zabezpieczyć przyczółek, przełamać
      Belbek i zdobyć Sewastopol.


      Flota Czarnomorska zostaje zaskoczona w trakcie mobilizacji. 810. Brygada Piechoty Morskiej przyjmuje
      pierwsze uderzenie, a miejscowe garnizony zyskują czas. Niepełne zgrupowania pułkowe 157. Dywizji
      Zmotoryzowanej zbierają się w Symferopolu i wchodzą do walki kolejnymi falami.


      NATO musi zdobyć Sewastopol; ZSRR musi odbić Kaczę i rozbić desant. Zajęcie Symferopola blokuje
      radzieckie posiłki dywizyjne. Brak osiągnięcia decydującego celu do 20. tury oznacza fiasko amerykańskiej
      inwazji.


      Zdobądź Sewastopol przed rozpoczęciem tury 20. Batalion ochrony desantu pozostaje nieruchomy w turach
      1–5. Utrata Kaczy nie kończy kampanii natychmiast: odbij przyczółek przed upływem terminu.'
    Landing Security Battalion: Ochrona przyczółka
    ? 'Hold Sevastopol until the operation deadline. Retake Kacha to cut US supply. Capturing the beachhead
      does not immediately end the campaign; US forces can counterattack before the deadline.


      Bakhchysarai guards the road from Simferopol. If the Americans seize Simferopol before turn nine
      begins, the 157th cannot deploy.


      Preserve the regular battalions for a counterattack. District aviation will support you when it
      arrives.'
    : 'Utrzymaj Sewastopol do końca operacji. Odbij Kaczę, aby odciąć amerykańskie zaopatrzenie. Zdobycie
      przyczółka nie kończy kampanii natychmiast; Amerykanie mogą kontratakować przed upływem terminu.


      Bachczysaraj osłania drogę z Symferopola. Jeśli Amerykanie zajmą Symferopol przed rozpoczęciem dziewiątej
      tury, 157. Dywizja nie zdoła się rozwinąć.


      Zachowaj regularne bataliony do kontrataku. Lotnictwo okręgu udzieli wsparcia po przybyciu.'
    ? 'Capture Sevastopol before turn 20 begins. The landing security battalion cannot move during turns
      1–5. Losing Kacha does not end the campaign immediately: retake the beachhead before the deadline.


      Belbek opens the northern approach; Balaklava opens the southern route. Taking Simferopol before
      turn nine begins prevents the Soviet 157th Division from deploying.


      Move quickly while you hold the advantage.'
    : 'Zdobądź Sewastopol przed rozpoczęciem tury 20. Batalion ochrony desantu pozostaje nieruchomy w
      turach 1–5. Utrata Kaczy nie kończy kampanii natychmiast: odbij przyczółek przed upływem terminu.


      Belbek otwiera północne podejście, a Bałakława południową drogę. Zajęcie Symferopola przed dziewiątą
      turą uniemożliwia rozwinięcie radzieckiej 157. Dywizji.


      Działaj szybko, dopóki masz przewagę.'
