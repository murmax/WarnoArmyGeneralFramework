    'Kacha: Defense of Sevastopol': 'Katscha: Verteidigung von Sewastopol'
    'NATO: take Sevastopol. USSR: retake Kacha.': 'NATO: Sewastopol einnehmen. UdSSR: Katscha zurückerobern.'
    '#US #SOV #medium{BLACK SEA — SEPTEMBER 1989} Kacha: Defense of Sevastopol': '#US #SOV #medium{SCHWARZES
      MEER — SEPTEMBER 1989} Katscha: Verteidigung von Sewastopol'
    Amphibious landing against the Black Sea Fleet base: Landungsoperation gegen die Basis der Schwarzmeerflotte
    DEFENSE OF SEVASTOPOL: VERTEIDIGUNG VON SEWASTOPOL
    ? Commander, you now lead the defense of Sevastopol. The Kacha landing has begun, but the main American
      force is still coming ashore.
    : Kommandeur, Sie führen nun die Verteidigung von Sewastopol. Die Landung bei Katscha hat begonnen,
      doch die amerikanische Hauptstreitmacht geht noch an Land.
    THE 810TH BRIGADE: DIE 810. BRIGADE
    ? Naval infantry protects Belbek, Bakhchysarai and Sevastopol. Facility guards are weaker; use them
      to preserve regular battalions for the decisive fight.
    : Marineinfanterie schützt Belbek, Bachtschyssaraj und Sewastopol. Die Objektschutzkräfte sind schwächer;
      setzen Sie sie ein, um reguläre Bataillone für den entscheidenden Kampf zu schonen.
    AIRFIELDS HIT: FLUGPLÄTZE GETROFFEN
    ? The first strike crippled Kacha airfield and destroyed most aircraft on the ground. Surviving helicopters
      joined the 881st Assault Battalion while the airfield guard still fights.
    : Der erste Schlag legte den Flugplatz Katscha lahm und zerstörte die meisten Flugzeuge am Boden.
      Überlebende Hubschrauber wurden dem 881. Sturmbataillon zugeteilt; die Flugplatzwache kämpft weiter.
    157TH MOTOR RIFLE DIVISION: 157. MOT.-SCHÜTZEN-DIVISION
    CRIMEAN BEACHHEAD: BRÜCKENKOPF AUF DER KRIM
    ? Colonel, the first landing wave has secured a foothold. Soviet outposts still resist, but the sea
      route for follow-on echelons is open.
    : Oberst, die erste Landungswelle hat einen Brückenkopf gesichert. Sowjetische Vorposten leisten noch
      Widerstand, doch der Seeweg für die folgenden Staffeln ist offen.
    INVASION FORCE: INVASIONSSTREITMACHT
    ? Infantry has amphibious vehicles, engineers and air defense. Heavy tanks follow later; open the
      exits from the beach before the Soviet line closes.
    : Die Infanterie verfügt über Amphibienfahrzeuge, Pioniere und Flugabwehr. Schwere Panzer folgen später;
      öffnen Sie die Strandausgänge, bevor sich die sowjetische Linie schließt.
    THE FLEET SUPPORTS THE ADVANCE: DIE FLOTTE UNTERSTÜTZT DEN VORMARSCH
    ? Carrier aircraft control western Crimea for now. Helicopters move reconnaissance and support the
      Marines; Soviet aircraft may return from other airfields.
    : Trägerflugzeuge beherrschen vorerst die westliche Krim. Hubschrauber transportieren Aufklärer und
      unterstützen die Marines; sowjetische Flugzeuge könnten von anderen Basen zurückkehren.
    TIME IS AGAINST US: DIE ZEIT LÄUFT GEGEN UNS
    VICTORY: SIEG
    Sevastopol has fallen. The landing force achieved its main objective; command approves the next phase.: Sewastopol
      ist gefallen. Die Landungsstreitmacht hat ihr Hauptziel erreicht; die Führung genehmigt die nächste
      Phase.
    OPERATION STALLED: OPERATION FESTGEFAHREN
    ? Sevastopol was not taken in time. No further American reinforcements will come; approaching Soviet
      reserves force the landing to prepare its defense.
    : Sewastopol wurde nicht rechtzeitig eingenommen. Weitere amerikanische Verstärkungen bleiben aus;
      anrückende sowjetische Reserven zwingen die Landungstruppen zur Verteidigung.
    OPERATION FAILED: OPERATION GESCHEITERT
    ? Sevastopol has not fallen. The landing failed to achieve its main objective, and command is terminating
      the operation. Holding the beachhead cannot change the outcome.
    : Sewastopol ist nicht gefallen. Die Landung verfehlte ihr Hauptziel, und die Führung beendet die
      Operation. Das Halten des Brückenkopfes kann den Ausgang nicht mehr ändern.
    SEVASTOPOL TAKEN: SEWASTOPOL EINGENOMMEN
    Marines occupy the Black Sea Fleet base. The main objective is complete.: Die Marines besetzen die
      Basis der Schwarzmeerflotte. Das Hauptziel ist erreicht.
    SEVASTOPOL ISOLATED: SEWASTOPOL ABGESCHNITTEN
    We hold the Kacha–Balaklava corridor. The city's land routes are cut.: Wir halten den Korridor Katscha–Balaklawa.
      Die Landverbindungen der Stadt sind unterbrochen.
    SEVASTOPOL HOLDS: SEWASTOPOL HÄLT STAND
    Sevastopol has not been taken or completely isolated. An assault would require extending the operation.: Sewastopol
      wurde weder eingenommen noch vollständig abgeschnitten. Ein Angriff würde eine Verlängerung der
      Operation erfordern.
    BEACHHEAD LOST: BRÜCKENKOPF VERLOREN
    Soviet forces retook Kacha. The ground force can no longer be supplied at scale.: Sowjetische Truppen
      haben Katscha zurückerobert. Die Bodenkräfte können nicht mehr ausreichend versorgt werden.
    BEACHHEAD HELD: BRÜCKENKOPF GEHALTEN
    Kacha remains ours. Sea supply continues, but the offensive has lost momentum.: Katscha bleibt in
      unserer Hand. Die Versorgung über See läuft weiter, doch die Offensive hat ihren Schwung verloren.
    CRIMEAN BREAKTHROUGH: DURCHBRUCH AUF DER KRIM
    Kacha and Simferopol are ours. Soviet reserve movement is disrupted.: Katscha und Simferopol gehören
      uns. Die Verlegung sowjetischer Reserven ist gestört.
    ? Sevastopol has held. Soviet forces have denied the American invasion its main objective. The enemy
      no longer has time for a decisive assault.
    : Sewastopol hat standgehalten. Sowjetische Truppen vereitelten das Hauptziel der amerikanischen Invasion.
      Dem Gegner bleibt keine Zeit mehr für einen entscheidenden Sturmangriff.
    DEFENSE CONTINUES: DIE VERTEIDIGUNG GEHT WEITER
    ? Sevastopol holds, but the landing remains in Crimea. Clearing the beachhead will require diverting
      additional reserves from other fronts.
    : Sewastopol hält stand, doch die Landungstruppen bleiben auf der Krim. Die Räumung des Brückenkopfes
      erfordert weitere Reserven von anderen Fronten.
    DEFENSE BROKEN: VERTEIDIGUNG DURCHBROCHEN
    Sevastopol is lost. Surviving units withdraw toward Simferopol and prepare a counterattack.: Sewastopol
      ist verloren. Überlebende Verbände ziehen sich nach Simferopol zurück und bereiten einen Gegenangriff
      vor.
    SEVASTOPOL LOST: SEWASTOPOL VERLOREN
    US forces occupy the Black Sea Fleet base. Survivors withdraw east.: US-Truppen besetzen die Basis
      der Schwarzmeerflotte. Die Überlebenden weichen nach Osten aus.
    SEVASTOPOL ENCIRCLED: SEWASTOPOL EINGEKESSELT
    US forces hold the corridor from Kacha to Balaklava. The garrison is cut off.: US-Truppen halten den
      Korridor von Katscha bis Balaklawa. Die Garnison ist abgeschnitten.
    SEVASTOPOL HELD: SEWASTOPOL GEHALTEN
    Sevastopol remains Soviet. Encirclement is incomplete; the land routes still need protection.: Sewastopol
      bleibt sowjetisch. Der Einschließungsring ist nicht geschlossen; die Landverbindungen müssen weiter
      geschützt werden.
    BEACHHEAD DESTROYED: BRÜCKENKOPF ZERSCHLAGEN
    Kacha has been retaken. The US sea supply route is broken.: Katscha wurde zurückerobert. Die amerikanische
      Versorgung über See ist unterbrochen.
    BEACHHEAD REMAINS: BRÜCKENKOPF BESTEHT WEITER
    US forces still hold Kacha, but their advance has stalled. Reserves move west.: US-Truppen halten
      Katscha noch, doch ihr Vormarsch stockt. Reserven rücken nach Westen vor.
    BREAKTHROUGH IN CRIMEA: EINBRUCH AUF DER KRIM
    US forces hold Kacha and Simferopol. The 157th Division's route is severed.: US-Truppen halten Katscha
      und Simferopol. Der Weg der 157. Division ist abgeschnitten.
    Second SEAL Detachment: Zweites SEAL-Kommando
    Choose the second SEAL landing zone. Kacha reinforces the beachhead; Balaklava enables an unsupplied deep raid.: Wählen
      Sie die Landezone des zweiten SEAL-Kommandos. Katscha verstärkt den Brückenkopf; Balaklawa ermöglicht
      einen unversorgten Vorstoß in die Tiefe.
    Secure the Beach: Strand sichern
    Land at Kacha beside the supply line.: Landung bei Katscha nahe der Versorgungslinie.
    Deep Raid: Tiefer Vorstoß
    Land at Balaklava without supply.: Landung bei Balaklawa ohne Versorgung.
    Reserve Regiment Ready: Reserveregiment bereit
    Three Black Sea Fleet reserve battalions are available in one Sevastopol reinforcement card.: Drei
      Reservebataillone der Schwarzmeerflotte stehen gemeinsam auf einer Verstärkungskarte in Sewastopol
      bereit.
    '157th: 91st Regiment': '157. Division: 91. Regiment'
    The 91st Motor Rifle Regiment reaches Simferopol. Keep the Bakhchysarai road open.: Das 91. Mot.-Schützen-Regiment
      erreicht Simferopol. Halten Sie die Straße durch Bachtschyssaraj offen.
    Division Reserve: Divisionsreserve
    The 2nd Marine Division HQ and a detached M1A1 battalion reach the beachhead.: Der Stab der 2. Marineinfanteriedivision
      und ein unterstelltes M1A1-Bataillon erreichen den Brückenkopf.
    Air Reinforcements: Luftverstärkungen
    ? Odessa Military District is sending another air group to Crimea. Request MiG-27s to strike armor
      or Su-25s to support the troops.
    : Der Militärbezirk Odessa entsendet eine weitere Luftgruppe auf die Krim. Fordern Sie MiG-27 gegen
      Panzer oder Su-25 zur Truppenunterstützung an.
    MiG-27: MiG-27
    Four MiG-27s will strike armor and defensive positions.: Vier MiG-27 greifen Panzer und Verteidigungsstellungen
      an.
    Su-25: Su-25
    Su-25s will support naval infantry and counterattacks near Sevastopol.: Su-25 unterstützen die Marineinfanterie
      und Gegenangriffe bei Sewastopol.
    Carrier Withdraws: Flugzeugträger zieht ab
    Carrier Damaged: Flugzeugträger beschädigt
    Frontline Wings Redeployed: Frontverbände neu eingesetzt
    Soviet Air Reinforcements: Sowjetische Luftverstärkungen
    The USSR continues deploying aviation in the sector. Intelligence reports new Su-24 and MiG-23 groups at the rear airbase.: Die
      UdSSR baut ihre Luftstreitkräfte im Sektor weiter aus. Die Aufklärung meldet neue Su-24- und MiG-23-Gruppen
      auf dem rückwärtigen Flugplatz.
    Deployment Prevented: Aufmarsch verhindert
    ? Simferopol was seized before the 157th could deploy. You intercepted its unloading and supply hub
      in time; the division will not reach Sevastopol.
    : Simferopol wurde vor dem Aufmarsch der 157. Division erobert. Sie haben ihren Entlade- und Versorgungsknoten
      rechtzeitig besetzt; die Division wird Sewastopol nicht erreichen.
    157th Division Deploys: 157. Division marschiert auf
    ? Simferopol was not captured in time. Soviet regimental groups have begun deploying; expect stronger
      defenses and counterattacks along the Bakhchysarai road.
    : Simferopol wurde nicht rechtzeitig erobert. Sowjetische Regimentsgruppen beginnen ihren Aufmarsch;
      rechnen Sie mit stärkerer Verteidigung und Gegenangriffen auf der Straße durch Bachtschyssaraj.
    ? 'Date: 7 September 1989

      Duration: 20 turns

      Area: Kacha — Belbek — Sevastopol, Crimea


      With both alliances committed in Central Europe, US command opens a new front on the Black Sea.
      The 2nd Marine Division lands at Kacha to secure its beachhead, break through Belbek and seize Sevastopol.


      The Black Sea Fleet is caught during mobilization. The 810th Naval Infantry Brigade faces the first
      assault while local garrisons buy time. Incomplete regimental groups of the 157th Motor Rifle Division
      assemble at Simferopol and enter the battle in successive waves.


      NATO must capture Sevastopol; the USSR must retake Kacha and break the landing. Taking Simferopol
      blocks Soviet divisional reinforcements. If neither decisive objective is achieved by turn 20, the
      operation ends in failure for the American invasion.'
    : 'Datum: 7. September 1989

      Dauer: 20 Runden

      Gebiet: Katscha — Belbek — Sewastopol, Krim


      Während beide Bündnisse in Mitteleuropa gebunden sind, eröffnet die amerikanische Führung eine neue
      Front am Schwarzen Meer. Die 2. Marineinfanteriedivision landet bei Katscha, um den Brückenkopf
      zu sichern, Belbek zu durchbrechen und Sewastopol einzunehmen.


      Die Schwarzmeerflotte wird während ihrer Mobilisierung überrascht. Die 810. Marineinfanteriebrigade
      fängt den ersten Schlag ab, während örtliche Garnisonen Zeit gewinnen. Unvollständige Regimentsgruppen
      der 157. Mot.-Schützen-Division sammeln sich in Simferopol und greifen in aufeinanderfolgenden Wellen
      ein.


      Die NATO muss Sewastopol einnehmen; die UdSSR muss Katscha zurückerobern und die Landung zerschlagen.
      Simferopols Eroberung blockiert sowjetische Divisionsverstärkungen. Wird das entscheidende Ziel
      bis Runde 20 nicht erreicht, scheitert die amerikanische Invasion.'
    ? 'Principal forces:


      #US 2nd Marine Division

      #US 6th and 8th Marines

      #US 2nd Tank Battalion and attached M1A1s

      #US 10th Marines artillery

      #US Navy SEAL and helicopter groups


      #US Carrier aviation and I-HAWK'
    : 'Hauptstreitkräfte:


      #US 2. Marineinfanteriedivision

      #US 6. und 8. Marineregiment

      #US 2. Panzerbataillon und unterstellte M1A1

      #US Artillerie des 10. Marineregiments

      #US Navy SEAL und Hubschraubergruppen


      #US Trägerflugzeuge und I-HAWK'
    ? 'Principal forces:


      #SOV 810th Naval Infantry Brigade

      #SOV 157th Motor Rifle Division

      #SOV 60th Air Defence Corps

      #SOV Black Sea Fleet garrisons and reserves

      #SOV Kacha territorial defence


      #SOV Soviet aviation'
    : 'Hauptstreitkräfte:


      #SOV 810. Marineinfanteriebrigade

      #SOV 157. Mot.-Schützen-Division

      #SOV 60. Luftverteidigungskorps

      #SOV Garnisonen und Reserven der Schwarzmeerflotte

      #SOV Territorialverteidigung Katscha


      #SOV Sowjetische Luftstreitkräfte'
    ? 'Hold Sevastopol until the operation ends. Retaking Kacha immediately defeats the landing.


      Bakhchysarai guards the road from Simferopol. If the Americans seize Simferopol before turn nine
      begins, the 157th cannot deploy.


      Preserve the regular battalions for a counterattack. District aviation will support you when it
      arrives.'
    : 'Halten Sie Sewastopol bis zum Ende der Operation. Die Rückeroberung Katschas zerschlägt die Landung
      sofort.


      Bachtschyssaraj schützt die Straße aus Simferopol. Erobern die Amerikaner Simferopol vor Beginn
      der neunten Runde, kann die 157. Division nicht aufmarschieren.


      Schonen Sie reguläre Bataillone für einen Gegenangriff. Die Bezirksluftstreitkräfte unterstützen
      Sie nach ihrer Ankunft.'
    ? 'Capture Sevastopol before the twenty-turn operation ends. Hold Kacha: losing the beachhead immediately
      defeats the landing.


      Belbek opens the northern approach; Balaklava opens the southern route. Taking Simferopol before
      turn nine begins prevents the Soviet 157th Division from deploying.


      Move quickly while you hold the advantage.'
    : 'Nehmen Sie Sewastopol ein, bevor die zwanzigründige Operation endet. Halten Sie Katscha: Der Verlust
      des Brückenkopfes bedeutet sofortiges Scheitern.


      Belbek öffnet den nördlichen Zugang, Balaklawa den südlichen Weg. Die Eroberung Simferopols vor
      Beginn der neunten Runde verhindert den Aufmarsch der sowjetischen 157. Division.


      Handeln Sie schnell, solange Sie im Vorteil sind.'
    ? Soviet submarines have damaged the carrier. It is withdrawing for repairs; F-14 and SEAD operations
      are suspended. The amphibious ships remain, and Harriers will continue supporting you. The entire
      operation is at risk. You have twenty hours — five turns — to take Sevastopol. Otherwise the landing
      will be declared a failure.
    : Sowjetische U-Boote haben den Träger beschädigt. Er zieht sich zur Reparatur zurück; F-14- und SEAD-Einsätze
      werden eingestellt. Die Landungsschiffe bleiben, und Harrier leisten weiter Unterstützung. Die gesamte
      Operation ist gefährdet. Ihnen bleiben zwanzig Stunden — fünf Runden — zur Einnahme Sewastopols.
      Andernfalls wird die Landung als gescheitert gewertet.
    ? 'Our submarines have damaged the American carrier and forced it to withdraw. F-14s and the SEAD
      group leave the sector; Harriers remain aboard the amphibious ships. The enemy operation is in jeopardy:
      they have twenty hours — five turns — to capture Sevastopol. Hold the city and defeat the invasion.'
    : 'Unsere U-Boote haben den amerikanischen Träger beschädigt und zum Rückzug gezwungen. F-14 und die
      SEAD-Gruppe verlassen den Sektor; Harrier bleiben auf den Landungsschiffen. Die feindliche Operation
      ist gefährdet: Ihnen bleiben zwanzig Stunden — fünf Runden — zur Eroberung Sewastopols. Halten Sie
      die Stadt und schlagen Sie die Invasion zurück.'
    ? Su-24 and MiG-23 wings have arrived directly from the front to defend Sevastopol. Both are at half
      strength and badly disorganized. Fuel and ammunition deliveries are only beginning, and the pilots
      are exhausted. Allow them at least a few hours of rest.
    : Su-24- und MiG-23-Gruppen sind direkt von der Front zur Verteidigung Sewastopols eingetroffen. Beide
      haben nur noch die Hälfte ihrer Stärke und sind stark desorganisiert. Treibstoff- und Munitionslieferungen
      laufen gerade erst an; die Piloten sind erschöpft. Gönnen Sie ihnen wenigstens einige Stunden Ruhe.
    ? 'Commander, you have been assigned to lead the defense of Sevastopol.


      Only twelve hours ago, High Command confirmed that the Americans were preparing a major landing
      operation in Crimea.


      We were too late.


      Forward US Marine Corps units have already landed at Kacha and secured a foothold. Fighting to expand
      the beachhead continues.'
    : 'Kommandeur, Ihnen wurde die Verteidigung von Sewastopol übertragen.


      Erst vor zwölf Stunden bestätigte das Oberkommando, dass die Amerikaner eine große Landungsoperation
      auf der Krim vorbereiten.


      Wir waren zu spät.


      Vorausabteilungen der US-Marineinfanterie sind bereits bei Katscha gelandet und haben sich an der
      Küste festgesetzt. Die Kämpfe zur Erweiterung des Brückenkopfes dauern an.'
    ? 'The backbone of the defense remains the Black Sea Fleet’s 810th Independent Naval Infantry Brigade.


      Its units are dispersed between Kacha, Belbek, Sevastopol and Bakhchysarai.


      Composite fleet garrisons, border guards and rear-area personnel also come under your command.


      Soviet aircraft will be redeployed to Crimea, but air support is scarce for now.'
    : 'Das Rückgrat der Verteidigung bildet weiterhin die 810. selbstständige Marineinfanteriebrigade
      der Schwarzmeerflotte.


      Ihre Verbände sind zwischen Katscha, Belbek, Sewastopol und Bachtschyssaraj verteilt.


      Auch zusammengefasste Flottengarnisonen, Grenztruppen und rückwärtiges Personal unterstehen Ihrem
      Kommando.


      Sowjetische Flugzeuge werden auf die Krim verlegt, doch Luftunterstützung ist vorerst knapp.'
    ? 'The first American strike targeted Black Sea Fleet aviation.


      Kacha airfield has been devastated. Most aircraft and helicopters were destroyed on the ground.


      Surviving Mi-8s and Ka-29s have been assigned to the 881st Independent Assault Battalion.


      Airfield guards and surviving technical personnel form a separate defensive group.'
    : 'Der erste amerikanische Schlag galt der Luftstreitmacht der Schwarzmeerflotte.


      Der Flugplatz Katscha wurde verwüstet. Die meisten Flugzeuge und Hubschrauber wurden am Boden zerstört.


      Überlebende Mi-8 und Ka-29 wurden dem 881. selbstständigen Sturmbataillon zugeteilt.


      Flugplatzwachen und überlebende Techniker bilden eine eigene Verteidigungsgruppe.'
    ? 'Colonel, the first phase of the operation is complete.


      Marines have landed at Kacha and secured a beachhead.


      Soviet aviation at nearby airfields has been largely destroyed, while the main Black Sea Fleet force
      has been diverted toward Romania.


      The principal phase now begins: the advance on Sevastopol.'
    : 'Oberst, die erste Phase der Operation ist abgeschlossen.


      Marines sind bei Katscha gelandet und haben einen Brückenkopf gesichert.


      Die sowjetische Luftwaffe auf den nahen Flugplätzen wurde größtenteils zerstört; die Hauptkräfte
      der Schwarzmeerflotte wurden in Richtung Rumänien abgelenkt.


      Nun beginnt die Hauptphase: der Vormarsch auf Sewastopol.'
    ? 'The landing force is built around units of II Marine Expeditionary Force.


      The 6th and 8th Marine Regiments form the first line.


      Armor, artillery and units of the 2nd Tank Battalion support them.


      An additional M1A1 tank group has been attached to break the Soviet defense.'
    : 'Die Landungsstreitmacht besteht im Kern aus Verbänden der II Marine Expeditionary Force.


      Das 6. und 8. Marineregiment bilden die erste Linie.


      Panzer, Artillerie und Teile des 2. Panzerbataillons unterstützen sie.


      Eine zusätzliche M1A1-Gruppe wurde zur Durchbrechung der sowjetischen Verteidigung unterstellt.'
    ? 'Carrier aircraft continue operations over western Crimea.


      Marine helicopters provide troop transport, supply and close support.


      Soviet air activity is currently negligible.


      This advantage is temporary: the enemy is already redeploying aircraft from other sectors.'
    : 'Trägerflugzeuge operieren weiter über der westlichen Krim.


      Hubschrauber der Marines übernehmen Truppentransport, Versorgung und Nahunterstützung.


      Sowjetische Luftaktivität ist derzeit kaum vorhanden.


      Dieser Vorteil ist nur vorübergehend: Der Gegner verlegt bereits Flugzeuge aus anderen Sektoren.'
    UNITED STATES — Attack: VEREINIGTE STAATEN — Angriff
    SOVIET UNION — Defense: SOWJETUNION — Verteidigung
    1st Air Assault Company: 1. Luftlandekompanie
    2nd Air Assault Company: 2. Luftlandekompanie
    3rd Air Assault Company: 3. Luftlandekompanie
    82-mm Mortars: 82-mm-Mörser
    Air Assault ATGMs: Luftlande-PALR
    Air Assault Engineers: Luftlandepioniere
    Air Assault MANPADS: Luftlande-Flugabwehr
    Air Defence Flight: Flugabwehrrotte
    Anti-Tank Flight: Panzerabwehrrotte
    American Armor Reinforced: US-Panzerkräfte verstärkt
    Beachhead Air Defense: Flugabwehr des Brückenkopfs
    Defense Conditions: Verteidigungsbedingungen
    Detached Heavy Tank Bn: Schweres Panzerbataillon
    HQ and Heavy Armor: Stab und schwere Panzer
    Helicopter Escort: Hubschrauberbegleitschutz
    Keep Standard: Standard beibehalten
    Make It Harder: Kampagne erschweren
    Marine M1s and Air Defense: Marine-M1 und Flugabwehr
    Mechanized Marine Company: Mechanisierte Marinekompanie
    Odessa Air Assault Bn 1: 1. Luftlandebataillon Odessa
    Odessa Air Assault Bn 2: 2. Luftlandebataillon Odessa
    Odessa Airmobile: Luftlandegruppe Odessa
    Odessa Airmobile Force: Luftlandegruppe Odessa
    Odessa Airmobile Group: Luftlandegruppe Odessa
