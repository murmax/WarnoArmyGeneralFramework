schema: 1
events:
- id: pact_difficulty
  side: pact
  trigger:
    turn: 1
  title:
    ru: Выбор сложности
    en: Difficulty
  text:
    ru: Выберите уровень сложности.
    en: Choose the difficulty level.
  image: pact_counterstroke_cards
  layout: graphic_cards
  ai_choice: 0
  effects: []
  choices:
  - label:
      ru: Обычный
      en: Normal
    effects: []
    card:
      image: pact_naval_infantry
      title:
        ru: Обычный
        en: Normal
      text:
        ru: Для знакомства с кампанией.
        en: For a first campaign.
  - label:
      ru: Суровый
      en: Harsh
    effects: []
    card:
      image: pact_artillery
      title:
        ru: Суровый
        en: Harsh
      text:
        ru: Для опытных командиров.
        en: For experienced commanders.
- id: nato_difficulty
  side: nato
  trigger:
